  .rail .method summary::-webkit-details-marker { display: none; }

  .grouphead .sub i { font: italic 600 13px var(--serif); }

<script>
  'use strict'
  if (!DATA) { document.body.textContent = 'No graph data injected — run: node graph.mjs build'; throw new Error('no data') }

  // ---- theme (embedding shell pins via ?theme=; standalone keeps toggle) ----
  const root = document.documentElement
  const pinnedTheme = new URLSearchParams(location.search).get('theme')
  if (pinnedTheme === 'light' || pinnedTheme === 'dark') {
    root.dataset.theme = pinnedTheme
    document.getElementById('themeBtn').style.display = 'none'
  } else {
    const t = localStorage.getItem('synergy-theme')
    if (t) root.dataset.theme = t
  }

    const dark = getComputedStyle(root).colorScheme.includes('dark')
    root.dataset.theme = dark ? 'light' : 'dark'

    readCSSColors(); drawMini(); drawCv()
  }
  let C = {}
  function readCSSColors() {
    const s = getComputedStyle(document.body)
    const v = (n) => s.getPropertyValue(n).trim()
    C = { surface: v('--surface-1'), page: v('--page'), ink1: v('--ink-1'), ink2: v('--ink-2'),
      mut: v('--mut'), faint: v('--faint'), hair: v('--hair'),
      cites: v('--e-cites'), authority: v('--e-auth'), text: v('--e-text'), commander: v('--commander') }
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readCSSColors(); drawMini(); drawCv() })

  // ---- language: the parsers that keep lab vocabulary off the primary surface ----
  const CIRCUITS = [['First', '1st Cir.'], ['Second', '2d Cir.'], ['Third', '3d Cir.'], ['Fourth', '4th Cir.'],
    ['Fifth', '5th Cir.'], ['Sixth', '6th Cir.'], ['Seventh', '7th Cir.'], ['Eighth', '8th Cir.'],
    ['Ninth', '9th Cir.'], ['Tenth', '10th Cir.'], ['Eleventh', '11th Cir.'],
    ['District of Columbia', 'D.C. Cir.'], ['Federal', 'Fed. Cir.']]
  function shortCourt(court) {
    if (!court) return ''
    for (const [word, abbr] of CIRCUITS) if (court.includes(word + ' Circuit')) return abbr
    return court
  }
  const GOV_RE = /^(?:united states|u\.?s\.?a?\.?|immigration|i\.?n\.?s\.?|sec\b|f\.?c\.?c\.?|state|people|commissioner|attorney general)/i
  function shortCase(name) {
    const sides = name.split(/\s+v\.?\s+/)
    if (sides.length !== 2) return name
    const pick = GOV_RE.test(sides[0]) && !GOV_RE.test(sides[1]) ? sides[1] : sides[0]
    const toks = pick.replace(/[,.]+$/, '').split(/\s+/)
    return toks[toks.length - 1].replace(/[^\w'’-]/g, '') || name
  }
  const topicWords = (t) => (t || '').replace(/-/g, ' ')
  const year = (s) => { const m = (s || '').match(/\b(?:18|19|20)\d{2}\b/); return m ? +m[0] : null }
  function fmtDate(s) {
    const m = (s || '').match(/(\d{4})-(\d{2})-(\d{2})/)
    if (!m) return s || ''
    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2] - 1]
    return `${+m[3]} ${mo} ${m[1]}`
  }
  // why -> 1-3 plain sentences; kills tokens that are just the case names ("liu")
  function whyParts(l, subj) {
    const o = nodes[l.id]
    const segs = (l.why || '').split(' · ')
    const out = { sentences: [], shared: [], terms: [], direct: null }
    const nameToks = new Set((subj.name + ' ' + o.name).toLowerCase().split(/[^a-z'’-]+/))
    for (const seg of segs) {
      let m
      if ((m = seg.match(/^(.+?) cites (.+)$/))) {
        out.direct = seg
        out.sentences.push(m[1] === subj.name ? 'Your matter cites it.' : 'Cites ' + (subj.kind === 'new' ? 'your matter' : ' ' + shortCase(subj.name)) + ' directly.')
      } else if ((m = seg.match(/^shared: (.+)$/))) {
        out.shared = m[1].split('; ')
        out.sentences.push(out.shared.length === 1
          ? `Relies on the same authority, ${out.shared[0]}.`
          : `Relies on ${out.shared.length} of the same authorities.`)
      } else if ((m = seg.match(/^terms: (.+)$/))) {
        out.terms = m[1].split(', ').filter((t) => !nameToks.has(t.toLowerCase())).slice(0, 3)
        if (out.terms.length) out.sentences.push(`Similar language: ${out.terms.join(', ')}.`)
      }
    }
    return out
  }
  const badgeFor = (l) => l.types.includes('cites') ? ['direct', 'cites your matter'] :
    l.types.includes('authority') ? ['', 'shared authorities'] : ['', 'similar language']

      (!query || (n.name + ' ' + (n.cite || '') + ' ' + n.topic).toLowerCase().includes(query)))
    list = activeTopic
      ? [...list].sort((a, b) => a.name.localeCompare(b.name))
      : [...list].sort((a, b) => relatedCount(b) - relatedCount(a))

    content.innerHTML =
      `<div class="introrow">
        <span class="sub-line">Pick a case, or try an example matter — you'll see what it connects to, and why. This is the sample library that ships with the app; your own matters connect here once firm import lands.</span>
        <button class="cta" id="tryExample">${exampleIdx < 0 ? 'Try an example matter' : 'Try another example matter'}</button>
      </div>
      <div class="searchbar"><input id="search" placeholder="Search your library — case name, citation, or topic" autocomplete="off" value="${esc(q)}"></div>
      <div class="chiprow">
        <button class="tchip ${activeTopic === null ? 'on' : ''}" data-topic="">All</button>
        ${topics.map((t) => `<button class="tchip ${activeTopic === t ? 'on' : ''}" data-topic="${esc(t)}">${esc(topicWords(t))}</button>`).join('')}
      </div>
      <div class="grouphead"><h2>Sample library</h2><span class="n">· ${list.length} of ${nodes.length} published opinions shipped with the app</span></div>
      <div class="sheet">${list.length ? list.map((n) =>
        `<button class="librow" data-id="${n.id}">
          <span class="nm">${esc(n.name)}</span>
          <span class="meta"><span class="cite">${esc(n.cite || '')}</span>${n.court ? ' · ' + esc(shortCourt(n.court)) : ''}${year(n.date) ? ' · ' + year(n.date) : ''} · ${esc(topicWords(n.topic))}</span>
          <span class="rel">${relatedCount(n)} related</span>
        </button>`).join('') :
        `<div class="noresults">No case matches &ldquo;${esc(q)}&rdquo;. Try a party name, a reporter citation (180 F.3d 957), or a topic.</div>`}</div>`
    wireSearch(renderLibrary, list)
    document.getElementById('tryExample').onclick = () => {
      if (!newIds.length) return
      exampleIdx = (exampleIdx + 1) % newIds.length
      setSubject(newIds[exampleIdx])
    }
    for (const el of content.querySelectorAll('.tchip')) el.onclick = () => {
      activeTopic = el.dataset.topic || null
      renderLibrary(document.getElementById('search')?.value || '')
      drawMini()
    }
    for (const el of content.querySelectorAll('.librow')) el.onclick = () => setSubject(+el.dataset.id)
  }
  function wireSearch(rerender, matches) {
    const el = document.getElementById('search')
    if (!el) return
    el.oninput = () => rerender(el.value)
    el.onkeydown = (ev) => { if (ev.key === 'Enter' && matches.length) setSubject(matches[0].id) }
  }

  // ---- subject state ----
  function setSubject(id) {
    subject = id
    subjLinks = id === null ? [] : (nodes[id].synergy || [])
    subjSet = new Set(subjLinks.map((l) => l.id))
    hoverRank = -1
    if (id === null) renderLibrary()
    else renderSubject()
    drawMini()
    document.getElementById('main').scrollTop = 0
    if (id !== null) {
      const n = nodes[id]
      announce(`${subjLinks.length} related cases for ${n.name}` +
        ((n.missing || []).length ? `; ${n.missing.length} authorities not cited.` : '.'))
      content.querySelector('.subjcard')?.focus?.()
    }
  }
  function rowHtml(l, k, subj) {
    const o = nodes[l.id]
    const w = whyParts(l, subj)
    const [bcls, bword] = badgeFor(l)
    const badgeText = bcls === 'direct'
      ? (subj.kind === 'new' ? 'cites your matter' : 'cites ' + shortCase(subj.name).toLowerCase())
      : bword
    return `<li data-rank="${k}" data-id="${o.id}">
      <button class="rowbtn" aria-expanded="false">
        <span class="rk">${k + 1}</span>
        <span class="nm">${esc(o.name)}</span>
        <span class="badge ${bcls}">${esc(badgeText)}</span>
        <span class="meta"><span class="cite">${esc(o.cite || '')}</span>${o.court ? ' · ' + esc(shortCourt(o.court)) : ''}${year(o.date) ? ' · ' + year(o.date) : ''} · ${esc(topicWords(o.topic))}</span>
        <span class="why">${esc(w.sentences.join(' ') || 'Connected within your library.')}</span>
      </button>
      <div class="rowx">
        ${w.shared.length ? `<div class="xline"><span class="lbl">Shared authorities</span><span class="chips">${w.shared.map((c) => `<span class="cchip">${esc(c)}</span>`).join('')}<button class="copybtn" data-copy="${esc(w.shared.join('; '))}">Copy</button></span></div>` : ''}
        ${w.terms.length ? `<div class="xline"><span class="lbl">Overlapping language</span><span>${esc(w.terms.join(' · '))}</span></div>` : ''}
        ${w.direct ? `<div class="xline"><span class="lbl">Direct citation</span><span>${esc(w.direct)}</span></div>` : ''}
        <div class="xdiag">
          <span>Ranked ${k + 1} of ${subjLinks.length} · internal score ${l.score.toFixed(3)} — comparable only within this list</span>
          <button class="act" data-subj="${o.id}">Make this the subject →</button>
          <button class="act" data-map="${o.id}">Show in map</button>
        </div>
      </div>
    </li>`
  }
  function renderSubject() {
    const n = nodes[subject]
    const cy = year(n.date)
    const groups = { earlier: [], later: [], undated: [] }
    subjLinks.forEach((l, k) => {
      const oy = year(nodes[l.id].date)
      const g = cy === null || oy === null ? 'undated' : oy <= cy ? 'earlier' : 'later'
      groups[g].push(rowHtml(l, k, n))
    })
    const short = n.kind === 'new' ? 'your matter' : shortCase(n.name)
    const miss = n.missing || []
    content.innerHTML =
      `<div class="backbar"><button class="back" id="backBtn">← All cases</button></div>
      <div class="subjcard" tabindex="-1">
        <h2>${esc(n.name)}${n.kind === 'new' ? '<span class="exchip">Example matter</span>' : ''}</h2>
        <div class="meta"><span class="cite">${esc(n.cite || '')}</span>${n.court ? ' · ' + esc(shortCourt(n.court)) : ''}${n.date ? ' · ' + esc(fmtDate(n.date)) : ''} · ${esc(topicWords(n.topic))}</div>
        <div class="count">${subjLinks.length} related cases from your library of ${nodes.length}.</div>
      </div>
      ${miss.length ? `<div class="misscard">
        <div class="ghead"><span>Authorities ${n.kind === 'new' ? "you haven't cited" : `not cited in ${esc(short)}`}</span><span>${miss.length} to check</span></div>
        <div class="glead">Cases in this list rely on these. ${n.kind === 'new' ? "Your matter doesn't cite them." : `${esc(short)} doesn't cite them.`}</div>
        ${miss.map((x) => {
          const names = (x.by || []).slice(0, 3).map((id) => `<i>${esc(shortCase(nodes[id].name))}</i>`)
          const byTxt = names.length
            ? `Relied on by ${names.join(', ')}${(x.by || []).length > 3 ? ` and ${x.by.length - 3} more` : ''}`
            : `Relied on by ${x.n} of the ${subjLinks.length} related cases below`
          return `<div class="missrow"><span class="mc">${esc(x.name)}</span><span class="by">${byTxt}</span><button class="copybtn" data-copy="${esc(x.name)}">Copy</button></div>`
        }).join('')}
      </div>` : ''}
      ${cy === null && subjLinks.length
        ? `<div class="grouphead"><h2>Related cases</h2><span class="n">· ${subjLinks.length}</span></div><div class="sheet"><ul class="rows">${[...groups.earlier, ...groups.later, ...groups.undated].join('')}</ul></div>`
        : `${groups.earlier.length ? `<div class="grouphead"><h2>Authorities to read</h2><span class="n">· ${groups.earlier.length}</span><div class="sub">Decided before or in the same year as <i>${esc(short)}</i>. Start here — these are the candidates to read before you cite anything.</div></div><div class="sheet"><ul class="rows">${groups.earlier.join('')}</ul></div>` : ''}
          ${groups.later.length ? `<div class="grouphead"><h2>Later cases applying them</h2><span class="n">· ${groups.later.length}</span><div class="sub">Decided after — how courts have used this ground since.</div></div><div class="sheet"><ul class="rows">${groups.later.join('')}</ul></div>` : ''}
          ${groups.undated.length ? `<div class="grouphead"><h2>Undated</h2><span class="n">· ${groups.undated.length}</span><div class="sub">No date parsed from the header.</div></div><div class="sheet"><ul class="rows">${groups.undated.join('')}</ul></div>` : ''}`}
      ${subjLinks.length === 0 ? '<div class="sheet"><div class="noresults">No related cases found — this document stands alone in the current library.</div></div>' : ''}
      <div class="footline">Ranked from the ${nodes.length} cases indexed on this machine. Citation sets are lower bounds — archival text is truncated.<button class="lnk" id="footHow">How these are ranked</button></div>`
    document.getElementById('backBtn').onclick = () => setSubject(null)
    document.getElementById('footHow').onclick = () => { const d = document.getElementById('method'); d.open = true; d.scrollIntoView({ block: 'nearest' }) }
    for (const li of content.querySelectorAll('.rows > li')) {
      const btn = li.querySelector('.rowbtn')
      btn.onclick = () => { li.classList.toggle('open'); btn.setAttribute('aria-expanded', li.classList.contains('open')) }
      li.addEventListener('mouseenter', () => { hoverRank = +li.dataset.rank; drawMini() })
      li.addEventListener('mouseleave', () => { hoverRank = -1; drawMini() })
    }
    for (const el of content.querySelectorAll('[data-subj]')) el.onclick = (ev) => { ev.stopPropagation(); setSubject(+el.dataset.subj) }
    for (const el of content.querySelectorAll('[data-map]')) el.onclick = (ev) => { ev.stopPropagation(); openOverlay() }
    for (const el of content.querySelectorAll('[data-copy]')) el.onclick = (ev) => {
      ev.stopPropagation()
      navigator.clipboard?.writeText(el.dataset.copy)
      el.textContent = 'Copied'; setTimeout(() => { el.textContent = 'Copy' }, 1200)
    }
  }

  // ---- force layout (unchanged physics; run once at boot, frozen; live only in overlay) ----
  let seed = 42
  const rand = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff
  const W = 1200, H = 900
  const clusters = [...new Set(nodes.map((n) => n.cluster))]
  for (const n of nodes) {
    const a = (clusters.indexOf(n.cluster) / clusters.length) * Math.PI * 2
    n.x = W / 2 + Math.cos(a) * 280 + (rand() - 0.5) * 120
    n.y = H / 2 + Math.sin(a) * 280 + (rand() - 0.5) * 120
    n.vx = 0; n.vy = 0
    n.r = 4 + Math.sqrt(n.strength) * 3.2
  }
  const maxW = {}
  for (const t of TYPES) maxW[t] = Math.max(...edges.filter((e) => e.type === t).map((e) => e.w), 1)
  for (const e of edges) e.nw = e.w / maxW[e.type]
  let alpha = 1
  let dragNode = null
  function tick() {
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i]
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j]
        let dx = a.x - b.x, dy = a.y - b.y
        let d2 = dx * dx + dy * dy
        if (d2 < 1) { dx = rand() - 0.5; dy = rand() - 0.5; d2 = 1 }
        const f = Math.min(1200 / d2, 6) * alpha
        const d = Math.sqrt(d2)
        a.vx += (dx / d) * f; a.vy += (dy / d) * f
        b.vx -= (dx / d) * f; b.vy -= (dy / d) * f
      }
    }
    for (const e of edges) {
      const a = nodes[e.s], b = nodes[e.t]
      const dx = b.x - a.x, dy = b.y - a.y
      const d = Math.sqrt(dx * dx + dy * dy) || 1
      const rest = 120 - 60 * e.nw
      const f = ((d - rest) / d) * 0.02 * (0.4 + e.nw) * alpha
      a.vx += dx * f; a.vy += dy * f
      b.vx -= dx * f; b.vy -= dy * f
    }
    for (const n of nodes) {
      n.vx += (W / 2 - n.x) * 0.004 * alpha
      n.vy += (H / 2 - n.y) * 0.004 * alpha
      if (n === dragNode) { n.vx = 0; n.vy = 0; continue }
      n.x += n.vx *= 0.85
      n.y += n.vy *= 0.85
    }
    alpha = Math.max(alpha * 0.995, 0.02)
  }
  for (let i = 0; i < 220; i++) tick()
  alpha = 0.02

  // ---- rail mini: radial (subject) or settled overview (library) ----
  const mini = document.getElementById('mini')
  const mctx = mini.getContext('2d')
  function drawMini() {
    const mw = mini.width = mini.clientWidth * (devicePixelRatio || 1)
    const mh = mini.height = mini.clientHeight * (devicePixelRatio || 1)
    mctx.setTransform(devicePixelRatio || 1, 0, 0, devicePixelRatio || 1, 0, 0)
    const w = mini.clientWidth, h = mini.clientHeight
    mctx.clearRect(0, 0, w, h)
    if (subject !== null) {
      // 12-spoke radial: rank-fixed angles, rank 1 nearest — legible at rail size
      const cx = w / 2, cy2 = h / 2
      subjLinks.forEach((l, k) => {
        const ang = (-90 + k * 30) * Math.PI / 180
        const len = 30 + 55 * (k / Math.max(subjLinks.length - 1, 1))
        const x = cx + Math.cos(ang) * len, y2 = cy2 + Math.sin(ang) * len * (h / 200)
        const hot = k === hoverRank
        mctx.globalAlpha = hot ? 1 : 0.75
        mctx.strokeStyle = hot ? C.ink1 : C.hair
        mctx.lineWidth = hot ? 2.5 : 1.2
        mctx.beginPath(); mctx.moveTo(cx, cy2); mctx.lineTo(x, y2); mctx.stroke()
        mctx.fillStyle = hot ? C.ink1 : C.ink2
        mctx.beginPath(); mctx.arc(x, y2, 4, 0, Math.PI * 2); mctx.fill()
        if (hot) {
          mctx.fillStyle = C.ink1
          mctx.font = '11px "IBM Plex Sans", sans-serif'
          mctx.fillText(shortCase(nodes[l.id].name), Math.min(x + 6, w - 60), y2 - 6)
        }
      })
      mctx.globalAlpha = 1
      mctx.fillStyle = C.ink1
      mctx.beginPath(); mctx.arc(cx, cy2, 7, 0, Math.PI * 2); mctx.fill()
      mctx.strokeStyle = C.commander; mctx.lineWidth = 2
      mctx.beginPath(); mctx.arc(cx, cy2, 10, 0, Math.PI * 2); mctx.stroke()
      mctx.globalAlpha = 0.5; mctx.lineWidth = 1.2
      mctx.beginPath(); mctx.arc(cx, cy2, 13, 0, Math.PI * 2); mctx.stroke()
      mctx.globalAlpha = 1
    } else {
      // settled 99-node overview, dots only
      let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9
      for (const n of nodes) { minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x); minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y) }
      const k = Math.min((w - 20) / (maxX - minX), (h - 20) / (maxY - minY))
      const tx = (x) => 10 + (x - minX) * k, ty = (y2) => 10 + (y2 - minY) * k
      mctx.globalAlpha = 0.12
      mctx.strokeStyle = C.ink2; mctx.lineWidth = 0.7
      for (const e of edges) {
        mctx.beginPath(); mctx.moveTo(tx(nodes[e.s].x), ty(nodes[e.s].y)); mctx.lineTo(tx(nodes[e.t].x), ty(nodes[e.t].y)); mctx.stroke()
      }
      mctx.globalAlpha = 0.8
      for (const n of nodes) {
        const dim = activeTopic && n.topic !== activeTopic
        mctx.fillStyle = dim ? C.hair : C.ink2
        mctx.beginPath(); mctx.arc(tx(n.x), ty(n.y), 2.2, 0, Math.PI * 2); mctx.fill()
      }
      mctx.globalAlpha = 1
    }
  }
  mini.addEventListener('mousemove', (ev) => {
    if (subject === null) return
    const r = mini.getBoundingClientRect()
    const mx = ev.clientX - r.left, my = ev.clientY - r.top
    const cx = r.width / 2, cy2 = r.height / 2
    let best = -1, bd = 1e9
    subjLinks.forEach((l, k) => {
      const ang = (-90 + k * 30) * Math.PI / 180
      const len = 30 + 55 * (k / Math.max(subjLinks.length - 1, 1))
      const x = cx + Math.cos(ang) * len, y2 = cy2 + Math.sin(ang) * len * (r.height / 200)
      const d = Math.hypot(mx - x, my - y2)
      if (d < 12 && d < bd) { best = k; bd = d }
    })
    if (best !== hoverRank) {
      hoverRank = best; drawMini()
      if (best >= 0) {
        const li = content.querySelector(`.rows > li[data-rank="${best}"]`)
        if (li) { for (const el of content.querySelectorAll('.rows > li')) el.style.background = ''; li.scrollIntoView({ block: 'nearest' }) }
      }
    }
  })
  mini.addEventListener('mouseleave', () => { if (hoverRank !== -1) { hoverRank = -1; drawMini() } })
  mini.addEventListener('click', (ev) => {
    if (subject === null) { openOverlay(); return }
    if (hoverRank >= 0) setSubject(subjLinks[hoverRank].id)
    else openOverlay()
  })

  // ---- full-map overlay (the old canvas, alive only while open) ----
  const overlay = document.getElementById('overlay')
  const cv = document.getElementById('cv')
  const ctx = cv.getContext('2d')
  let view = { x: 0, y: 0, k: 1 }
  let autoFit = true
  let hoverNode = null
  let rafOn = false
  document.getElementById('ovTitle').textContent = `Map — ${M.nodes} cases, ${M.edges} connections`
  function fitView() {
    const rect = cv.getBoundingClientRect()
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
    for (const n of nodes) {
      if (subject !== null && n.id !== subject && !subjSet.has(n.id)) continue
      minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x)
      minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y)
    }
    if (!isFinite(minX)) { minX = 0; minY = 0; maxX = W; maxY = H }
    const pad = 90
    const bw = maxX - minX + pad * 2, bh = maxY - minY + pad * 2
    view.k = Math.min(Math.min(rect.width / bw, rect.height / bh), 2.4)
    view.x = rect.width / 2 - ((minX + maxX) / 2) * view.k
    view.y = rect.height / 2 - ((minY + maxY) / 2) * view.k
  }
  function resize() {
    const rect = cv.getBoundingClientRect()
    const dpr = devicePixelRatio || 1
    cv.width = rect.width * dpr
    cv.height = rect.height * dpr
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  }
  const visible = (n) => !activeTopic || n.topic === activeTopic
  function nodeAlpha(n) {
    if (subject !== null) {
      if (n.id === subject) return 1
      return subjSet.has(n.id) ? 0.95 : 0.06
    }
    return visible(n) ? 0.95 : 0.12
  }
  const synMax = Math.max(...nodes.map((n) => (n.synergy && n.synergy[0] ? n.synergy[0].score : 0)), 0.001)
  const shortLabel = (s) => (s.length > 34 ? s.slice(0, 32) + '…' : s)
  function drawCv() {
    if (!overlay.classList.contains('on')) return
    const rect = cv.getBoundingClientRect()
    ctx.clearRect(0, 0, rect.width, rect.height)
    ctx.save()
    ctx.translate(view.x, view.y)
    ctx.scale(view.k, view.k)
    for (const e of edges) {
      const a = nodes[e.s], b = nodes[e.t]
      let al = 0.18 + 0.5 * e.nw
      if (subject !== null) al = e.s === subject || e.t === subject ? 0.55 : 0.03
      else if (activeTopic && !(visible(a) && visible(b))) al = 0.04
      if (hoverNode !== null && (e.s === hoverNode || e.t === hoverNode)) al = 0.9
      ctx.globalAlpha = al
      ctx.strokeStyle = C[e.type]
      ctx.lineWidth = (0.6 + 2.4 * e.nw) / view.k
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke()
    }
    if (subject !== null) {
      const c = nodes[subject]
      for (const l of subjLinks) {
        const b = nodes[l.id]
        ctx.globalAlpha = 0.85
        ctx.strokeStyle = C[l.types[0]] || C.ink2
        ctx.lineWidth = (0.8 + 2.6 * (l.score / synMax)) / view.k
        ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(b.x, b.y); ctx.stroke()
      }
    }
    for (const n of nodes) {
      const isSubj = n.id === subject
      const r = isSubj ? n.r * 1.5 + 3 : n.r
      ctx.globalAlpha = nodeAlpha(n)
      ctx.fillStyle = isSubj || n.id === hoverNode ? C.ink1 : C.ink2
      ctx.strokeStyle = C.surface
      ctx.lineWidth = 2 / view.k
      ctx.beginPath()
      if (n.kind === 'new') {
        ctx.save(); ctx.translate(n.x, n.y); ctx.rotate(Math.PI / 4); ctx.rect(-r, -r, r * 2, r * 2); ctx.restore()
      } else ctx.arc(n.x, n.y, r, 0, Math.PI * 2)
      ctx.fill(); ctx.stroke()
      if (isSubj) {
        ctx.strokeStyle = C.commander
        ctx.globalAlpha = 1; ctx.lineWidth = 2.5 / view.k
        ctx.beginPath(); ctx.arc(n.x, n.y, r + 5 / view.k, 0, Math.PI * 2); ctx.stroke()
        ctx.globalAlpha = 0.45; ctx.lineWidth = 1.5 / view.k
        ctx.beginPath(); ctx.arc(n.x, n.y, r + 10 / view.k, 0, Math.PI * 2); ctx.stroke()
      }
    }
    ctx.globalAlpha = 1
    ctx.font = `${11 / view.k}px "IBM Plex Sans", sans-serif`
    const labelled = new Set()
    if (hoverNode !== null) labelled.add(hoverNode)
    if (subject !== null) { labelled.add(subject); for (const l of subjLinks) labelled.add(l.id) }
    for (const id of labelled) {
      const n = nodes[id]
      if (nodeAlpha(n) < 0.5) continue
      ctx.fillStyle = id === subject ? C.commander : id === hoverNode ? C.ink1 : C.ink2
      ctx.fillText(shortLabel(n.name), n.x + n.r + 4 / view.k, n.y + 4 / view.k)
    }
    ctx.restore()
  }
  function loop() {
    if (!rafOn) return
    if (alpha > 0.021) { tick(); if (autoFit) fitView() }
    drawCv()
    requestAnimationFrame(loop)
  }
  function openOverlay() {
    overlay.classList.add('on')
    resize(); autoFit = true; fitView()
    rafOn = true; loop()
  }
  function closeOverlay() { overlay.classList.remove('on'); rafOn = false }
  document.getElementById('openMap').onclick = openOverlay
  document.getElementById('closeMap').onclick = closeOverlay
  document.getElementById('resetView').onclick = () => { autoFit = true; alpha = Math.max(alpha, 0.1); fitView(); drawCv() }
  overlay.addEventListener('click', (ev) => { if (ev.target === overlay) closeOverlay() })
  addEventListener('resize', () => { if (overlay.classList.contains('on')) { resize(); if (autoFit) fitView(); drawCv() } })

  // overlay interactions: pan / zoom / drag / tooltip / click-to-select
  const toWorld = (mx, my) => [(mx - view.x) / view.k, (my - view.y) / view.k]
  function pick(mx, my) {
    const [x, y2] = toWorld(mx, my)
    let best = null, bd = Infinity
    for (const n of nodes) {
      const d = Math.hypot(n.x - x, n.y - y2)
      if (d < n.r + 5 && d < bd) { best = n.id; bd = d }
    }
    return best
  }
  const tooltip = document.getElementById('tooltip')
  let panning = false, px = 0, py = 0
  cv.addEventListener('pointerdown', (ev) => {
    const id = pick(ev.offsetX, ev.offsetY)
    if (id !== null) { dragNode = nodes[id]; alpha = Math.max(alpha, 0.25) }
    else panning = true
    px = ev.offsetX; py = ev.offsetY
    cv.setPointerCapture(ev.pointerId)
  })
  cv.addEventListener('pointermove', (ev) => {
    if (dragNode) {
      const [x, y2] = toWorld(ev.offsetX, ev.offsetY)
      dragNode.x = x; dragNode.y = y2
      alpha = Math.max(alpha, 0.2)
      return
    }
    if (panning) {
      if (Math.hypot(ev.offsetX - px, ev.offsetY - py) > 2) autoFit = false
      view.x += ev.offsetX - px; view.y += ev.offsetY - py
      px = ev.offsetX; py = ev.offsetY
      drawCv()
      return
    }
    const id = pick(ev.offsetX, ev.offsetY)
    if (id !== hoverNode) { hoverNode = id; drawCv() }
    if (id !== null) {
      const n = nodes[id]
      tooltip.innerHTML = `<div class="t-name">${esc(n.name)}</div>` +
        `<div class="t-meta">${esc(n.cite || '?')}${n.court ? ' · ' + esc(shortCourt(n.court)) : ''}${year(n.date) ? ' · ' + year(n.date) : ''}</div>`
      tooltip.style.display = 'block'
      const mrect = cv.getBoundingClientRect()
      tooltip.style.left = Math.min(ev.offsetX + 14, mrect.width - 310) + 'px'
      tooltip.style.top = ev.offsetY + 14 + 'px'
      cv.style.cursor = 'pointer'
    } else { tooltip.style.display = 'none'; cv.style.cursor = panning ? 'grabbing' : 'default' }
  })
  cv.addEventListener('pointerup', (ev) => {
    if (dragNode && Math.hypot(ev.offsetX - px, ev.offsetY - py) < 4) { setSubject(dragNode.id); closeOverlay() }
    dragNode = null; panning = false
  })
  cv.addEventListener('wheel', (ev) => {
    ev.preventDefault()
    autoFit = false
    const f = ev.deltaY < 0 ? 1.15 : 1 / 1.15
    const [wx, wy] = toWorld(ev.offsetX, ev.offsetY)
    view.k *= f
    view.x = ev.offsetX - wx * view.k
    view.y = ev.offsetY - wy * view.k
    drawCv()
  }, { passive: false })

  // edge table
  document.querySelector('#edgeTable tbody').innerHTML = [...edges]
    .sort((a, b) => b.nw - a.nw)
    .map((e) => `<tr><td>${esc(nodes[e.s].name)}</td><td>${esc(nodes[e.t].name)}</td><td>${e.type}</td><td>${e.w}</td><td>${esc(e.detail || '')}</td></tr>`)
    .join('')

  // ---- keyboard ----
  addEventListener('keydown', (ev) => {
    if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA') {
      if (ev.key === 'Escape') ev.target.blur()
      return
    }
    if (ev.key === 'Escape') { if (overlay.classList.contains('on')) closeOverlay(); else if (subject !== null) setSubject(null); return }
    if (ev.key === '/') { ev.preventDefault(); document.getElementById('search')?.focus(); return }
    if (ev.key === 'm') { overlay.classList.contains('on') ? closeOverlay() : openOverlay(); return }
    if (subject === null) return
    const lis = [...content.querySelectorAll('.rows > li')]
    if (!lis.length) return
    const focused = document.activeElement?.closest?.('li')
    const idx = focused ? lis.indexOf(focused) : -1
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault()
      const next = lis[Math.max(0, Math.min(lis.length - 1, idx + (ev.key === 'ArrowDown' ? 1 : -1)))]
      next?.querySelector('.rowbtn')?.focus()
    }
    if (ev.key === 'o' && focused) setSubject(+focused.dataset.id)
  })

  // ---- boot ----
  readCSSColors()
  renderLibrary()
  drawMini()
</script>
</body>
</html>
