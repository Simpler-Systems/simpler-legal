<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Related cases — Simpler Legal</title>
<style>
  /* Design of record (owner ruling, 2026-09-12): 40/60 — a persistent case searcher
     on the left, the whole map on the right, full-screenable. It supersedes the
     list-first design of 2026-07-24, in which the graph was demoted to a 296px rail
     mini plus a modal overlay; the reasoning is that a lawyer already knows these
     cases by name, so finding one is a search box, and the map is what is being read.
     Palette = the app shell's tokens VERBATIM so the iframe seam disappears;
     ?theme=light|dark pins the scheme when embedded. */
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; font-style: normal; font-display: swap; src: url('/fonts/IBMPlexSans-Regular-Latin1.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 450; font-style: normal; font-display: swap; src: url('/fonts/IBMPlexSans-Text-Latin1.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 500; font-style: normal; font-display: swap; src: url('/fonts/IBMPlexSans-Medium-Latin1.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 600; font-style: normal; font-display: swap; src: url('/fonts/IBMPlexSans-SemiBold-Latin1.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Serif'; font-weight: 600; font-style: normal; font-display: swap; src: url('/fonts/IBMPlexSerif-SemiBold-Latin1.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Serif'; font-weight: 600; font-style: italic; font-display: swap; src: url('/fonts/IBMPlexSerif-SemiBoldItalic-Latin1.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-style: normal; font-display: swap; src: url('/fonts/IBMPlexMono-Regular-Latin1.woff2') format('woff2'); }
  :root {
    color-scheme: light;
    --page: #EDEBE7;
    --surface-1: #FFFFFF;
    --chrome: #F7F6F3;
    --card: #FCFCFB;
    --hover: #E7E5E0;
    --hair: #D8D5CF;
    --border: #C9C5BD;
    --border-strong: #87837B;
    --ink-1: #37352F;
    --ink-2: #5D5951;
    --mut: #65605A;
    --faint: #9B968E;
    --navy: #16324F;
    --navy-deep: #0F2438;
    --amber: #8C6109;
    --amber-wash: #FBF3DB;
    --commander: #A8801B;
    --e-cites: #33628F;
    --e-auth: #C2621F;
    --e-text: #1E8A63;
    /* Outcome of the appeal, on one axis: did the decision below survive. Deliberately
       NOT good/bad — on an appeal an affirmance is a win only if your client won below,
       and this library holds cases from both sides.

       Three tokens per state. FILL is what the node is painted; ACCENT is the chip text
       and the dot rim, dark enough to read as type; WASH is the chip ground.

       The fills are a LIGHTNESS LADDER, not three hues at one brightness: the further the
       decision below was disturbed, the further the node sits from the page ground. That
       is the only channel that survives with no colour vision at all, and green-vs-red is
       the classic collapse — at equal lightness the two ends measured 13.9 dE00 apart
       under deuteranopia, i.e. one colour. Measured now: end-to-end contrast 2.19:1 here
       and 3.12:1 dark; worst within-scale dichromat separation 14.0 dE00. Balancing these
       lightnesses for visual harmony is the edit that would break it silently.

       Kept clear of the colours the viewer has already spent — >= 24.9 dE00 from the
       commander gold and >= 36.3 from the similar-language green in this theme. The word
       rides beside the colour in the card, the legend AND the list rows, so nothing here
       has to be decoded from a hue. */
    --o-up: #E7F2DC;    --o-up-accent: #3F6B32;    --o-up-wash: #F2F8EC;
    --o-split: #EFD79A; --o-split-accent: #7A5A10; --o-split-wash: #F9EFD4;
    --o-down: #D98F92;  --o-down-accent: #8E1F2C;  --o-down-wash: #F7DFDE;
    --sh-card: 0 1px 3px rgba(31,29,26,.05);
    --sh-paper: 0 1px 3px rgba(31,29,26,.08), 0 12px 32px rgba(31,29,26,.07);
    --sans: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    --serif: 'IBM Plex Serif', Georgia, serif;
    --mono: 'IBM Plex Mono', Consolas, ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #232220; --surface-1: #2A2826; --chrome: #262523; --card: #2A2826;
      --hover: #35322E; --hair: rgba(231,228,222,.14); --border: rgba(231,228,222,.18);
      --border-strong: #767068; --ink-1: #E7E4DE; --ink-2: #B4AEA5; --mut: #9A948A;
      --faint: #716C64; --navy: #3E6B9C; --navy-deep: #34597F;
      --amber: #DBB86A; --amber-wash: rgba(212,175,55,.09); --commander: #D4AF37;
      --e-cites: #6E96BE; --e-auth: #D97A3D; --e-text: #3FA985;
      --o-up: #5E7345; --o-up-accent: #BBD3A1; --o-up-wash: #242A22;
      --o-split: #A28545; --o-split-accent: #EBD7A8; --o-split-wash: #2E2923;
      --o-down: #F4BAB1; --o-down-accent: #F4BAB1; --o-down-wash: #322624;
      --sh-card: none; --sh-paper: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #232220; --surface-1: #2A2826; --chrome: #262523; --card: #2A2826;
    --hover: #35322E; --hair: rgba(231,228,222,.14); --border: rgba(231,228,222,.18);
    --border-strong: #767068; --ink-1: #E7E4DE; --ink-2: #B4AEA5; --mut: #9A948A;
    --faint: #716C64; --navy: #3E6B9C; --navy-deep: #34597F;
    --amber: #DBB86A; --amber-wash: rgba(212,175,55,.09); --commander: #D4AF37;
    --e-cites: #6E96BE; --e-auth: #D97A3D; --e-text: #3FA985;
    --o-up: #5E7345; --o-up-accent: #BBD3A1; --o-up-wash: #242A22;
    --o-split: #A28545; --o-split-accent: #EBD7A8; --o-split-wash: #2E2923;
    --o-down: #F4BAB1; --o-down-accent: #F4BAB1; --o-down-wash: #322624;
    --sh-card: none; --sh-paper: none;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--page); color: var(--ink-1); font: 450 14px/1.5 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  :focus-visible { outline: 2px solid var(--ink-1); outline-offset: -2px; border-radius: 4px; }

  /* ── header ── */
  .top { flex: none; height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: var(--chrome); border-bottom: 1px solid var(--hair); }
  .top h1 { font: 600 19px var(--serif); letter-spacing: -0.01em; }
  .top .spacer { flex: 1; }
  #themeBtn { color: var(--ink-2); border: 1px solid var(--hair); background: var(--surface-1); border-radius: 6px; padding: 3px 9px; }

  /* ── two panes: 40 searcher / 60 map ────────────────────────
     RULE, carried forward: no element of this lane is ever display:none at any
     width. The map used to live in an aside that vanished below 1040px of frame
     — i.e. on every normal window, since the app's nav rail eats 224px — so the
     one asset that says "this is not a list" was never on screen. Under 900px
     the two panes STACK, map first. They never hide.
     The split is 40/60 by owner ruling: a lawyer already knows these cases by
     name, so the searcher only has to find one; the map is the thing being read. */
  .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(318px, 40fr) minmax(0, 60fr); gap: 16px; padding: 14px 16px; }
  .pane-list { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .listhead { flex: none; }
  .listscroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 36px; }

  /* ── page head: the lane says what it is, on arrival, at every width ── */
  .pagehead { margin: 2px 0 12px; }
  .pagehead h1 { font: 600 26px var(--serif); letter-spacing: -0.015em; }
  .pagehead .lede { color: var(--ink-2); font-size: 13.5px; max-width: 72ch; margin-top: 4px; }
  .notice { background: var(--amber-wash); border: 1px solid var(--amber); border-radius: 8px; padding: 9px 12px; margin-bottom: 14px; color: var(--ink-1); font-size: 13px; }

  /* ── the map pane: card chrome, so the canvas reads as an instrument ── */
  .pane-map { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface-1); border: 1px solid var(--hair); border-radius: 12px; box-shadow: var(--sh-card); overflow: hidden; }
  .maptop { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--hair); background: var(--chrome); }
  .maptop .mapttl { font: 600 12.5px var(--sans); color: var(--ink-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .maptop .spacer { flex: 1; }
  .maptop .ctl { flex: none; color: var(--ink-2); border: 1px solid var(--hair); background: var(--surface-1); border-radius: 6px; padding: 3px 10px; font-size: 12.5px; white-space: nowrap; }
  .maptop .ctl:hover { color: var(--ink-1); background: var(--hover); }
  .mapstage { flex: 1; min-height: 0; position: relative; }
  .mapfoot { flex: none; border-top: 1px solid var(--hair); padding: 7px 12px; }
  /* Full screen never means a second canvas — one renderer, one hit test, two
     containers. The class is the fallback; :fullscreen is the real one, and it
     needs its own background or the native backdrop shows through as black. */
  .pane-map.full { position: fixed; inset: 0; z-index: 60; border: none; border-radius: 0; }
  .pane-map:fullscreen { background: var(--surface-1); border: none; border-radius: 0; }

  /* ── map furniture ── */
  .mapfoot .maplegend { font-size: 11.5px; color: var(--mut); line-height: 1.6; display: block; }
  .maplegend .lgl { margin-right: 6px; }
  .maplegend .lg { display: inline-flex; align-items: center; gap: 4px; margin-right: 9px; white-space: nowrap; }
  .maplegend .lg::before { content: ''; width: 8px; height: 8px; border-radius: 99px; background: var(--c); flex: none;
    box-shadow: inset 0 0 0 1.5px var(--r, transparent); }
  /* the legend swatch is the same mark the map draws, hollow included */
  .maplegend .lg.hollow::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .edges { margin-top: 6px; }
  .edges summary { color: var(--mut); font-size: 11.5px; cursor: pointer; }
  .edges .tw { max-height: 26vh; overflow: auto; margin-top: 6px; }
  .edges table { border-collapse: collapse; width: 100%; font-size: 11.5px; }
  .edges th, .edges td { text-align: left; padding: 3px 8px; border-top: 1px solid var(--hair); }
  .edges th { color: var(--mut); font-weight: 600; position: sticky; top: 0; background: var(--surface-1); }
  .pagefoot { margin-top: 30px; border-top: 1px solid var(--hair); padding-top: 14px; }
  .pagefoot .method { margin-top: 12px; font-size: 12.5px; }
  .pagefoot .method summary { color: var(--mut); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; list-style: none; }
  .pagefoot .method summary::-webkit-details-marker { display: none; }
  .pagefoot .method .pop { margin-top: 10px; background: var(--surface-1); border: 1px solid var(--hair); border-radius: 8px; padding: 10px 12px; color: var(--ink-2); font-size: 12px; line-height: 1.55; }
  .pagefoot .method .pop p { margin: 0 0 8px; }

  /* ── shared list furniture ── */
  .sheet { background: var(--surface-1); border: 1px solid var(--hair); border-radius: 10px; box-shadow: var(--sh-card); overflow: hidden; }
  .grouphead { margin: 28px 0 8px; }
  .grouphead h2 { display: inline; font: 600 14.5px var(--sans); color: var(--ink-1); }
  .grouphead .n { color: var(--mut); font-size: 12.5px; font-weight: 400; margin-left: 4px; }
  .grouphead .sub { font-size: 12.5px; color: var(--mut); margin-top: 2px; }
  .grouphead .sub i { font: italic 600 13px var(--serif); }

  /* ── search + chips ── */
  .searchbar { position: sticky; top: 0; z-index: 10; background: var(--page); padding: 4px 0 10px; }
  #search { width: 100%; background: var(--surface-1); color: var(--ink-1); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font: inherit; }
  #search::placeholder { color: var(--faint); }
  .chiprow { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
  .tchip { font-size: 12.5px; color: var(--ink-2); border: 1px solid var(--hair); background: var(--surface-1); border-radius: 99px; padding: 3px 11px; }
  .tchip:hover { background: var(--hover); }
  .tchip.on { color: var(--ink-1); border-color: var(--border-strong); font-weight: 600; }

  /* ── library state ── */
  .introrow { display: flex; align-items: center; gap: 14px; margin: 2px 0 14px; flex-wrap: wrap; }
  .sub-line { color: var(--ink-2); font-size: 13.5px; max-width: 58ch; }
  .cta { background: var(--navy); color: #fff; font: 600 14px var(--sans); padding: 10px 18px; border-radius: 8px; flex: none; }
  .cta:hover { background: var(--navy-deep); color: #fff; }
  /* Two rows, not one line. On a single baseline row the pane's 40% left the
     citation line ellipsised mid-court — "260 F.3d 424 · 5th Cir. · 2001 · …" —
     and the topic, which is the part you scan for, was always the part cut. */
  .librow { display: grid; grid-template-columns: 1fr auto; column-gap: 10px; row-gap: 2px; width: 100%; text-align: left; padding: 10px 16px; border-top: 1px solid var(--hair); align-items: baseline; }
  .librow:first-child { border-top: none; }
  .librow:hover { background: var(--hover); }
  /* explicit rows: DOM order is name, meta, count, so auto-placement put the
     count on a third row of its own instead of beside the name it qualifies */
  .librow .nm { grid-column: 1; grid-row: 1; font: 600 14.5px var(--serif); color: var(--ink-1); }
  .librow:hover .nm { text-decoration: underline; text-underline-offset: 2px; }
  .librow .meta { grid-column: 1 / 3; grid-row: 2; color: var(--ink-2); font-size: 12px; }
  .librow .meta .cite { font-family: var(--mono); font-size: 12px; }
  .librow .rel { grid-column: 2; grid-row: 1; color: var(--mut); font-size: 12px; white-space: nowrap; }
  .noresults { padding: 18px 16px; color: var(--mut); font-size: 13px; }

  /* ── subject state ── */
  .backbar { position: sticky; top: 0; z-index: 11; background: var(--page); padding: 4px 0 8px; }
  .back { color: var(--ink-2); font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }
  .back:hover { color: var(--ink-1); }
  .subjcard { background: var(--surface-1); border: 1px solid var(--hair); border-radius: 10px; box-shadow: var(--sh-card); padding: 14px 16px; margin-bottom: 20px; }
  .subjcard h2 { font: 600 20px var(--serif); letter-spacing: -0.01em; }
  .subjcard .meta { color: var(--ink-2); font-size: 13px; margin-top: 3px; }
  .subjcard .meta .cite { font-family: var(--mono); font-size: 12.5px; }
  .subjcard .count { color: var(--mut); font-size: 12.5px; margin-top: 6px; }
  .exchip { font: 600 10px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; vertical-align: 2px; margin-left: 8px; }

  /* ── missing authorities (borrowed from Review's guided card) ── */
  .misscard { background: var(--surface-1); border: 1.5px solid var(--amber); border-radius: 10px; box-shadow: var(--sh-paper); padding: 12px 14px; margin-bottom: 8px; }
  .misscard .ghead { display: flex; justify-content: space-between; font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--amber); }
  .misscard .glead { font-size: 12.5px; color: var(--ink-2); margin: 5px 0 4px; }
  .missrow { display: flex; align-items: baseline; gap: 12px; padding: 7px 0 0; font-size: 12px; }
  .missrow .mc { font-family: var(--mono); font-size: 13.5px; color: var(--ink-1); flex: none; min-width: 110px; }
  .missrow .by { color: var(--mut); }
  .missrow .by i { font: italic 600 12.5px var(--serif); color: var(--ink-2); }
  .copybtn { margin-left: auto; flex: none; font-size: 11px; color: var(--mut); border: 1px solid var(--hair); border-radius: 5px; padding: 1px 7px; background: var(--card); }
  .copybtn:hover { color: var(--ink-1); background: var(--hover); }

  .okcard { background: var(--surface-1); border: 1px solid var(--hair); border-radius: 10px; box-shadow: var(--sh-card); padding: 12px 14px; margin-bottom: 8px; }
  .okcard .ghead { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--mut); }
  .okcard .glead { font-size: 12.5px; color: var(--ink-2); margin-top: 5px; }

  /* ── result rows ── */
  .rows { list-style: none; }
  .rowbtn { display: grid; grid-template-columns: 22px 1fr auto; column-gap: 8px; width: 100%; text-align: left; padding: 14px 16px; border-top: 1px solid var(--hair); align-items: baseline; }
  li:first-child .rowbtn { border-top: none; }
  .rowbtn:hover { background: var(--hover); }
  li.open .rowbtn { background: var(--card); box-shadow: inset 2px 0 0 var(--ink-1); }
  .rowbtn .rk { font: 400 12px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
  .rowbtn .nm { font: 600 16px var(--serif); line-height: 1.3; color: var(--ink-1); }
  .rowbtn:hover .nm { text-decoration: underline; text-underline-offset: 2.5px; }
  .badge { font: 600 10px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; white-space: nowrap; align-self: start; margin-top: 3px; }
  .badge.direct { color: var(--ink-1); background: var(--surface-1); border-color: var(--border-strong); }
  .rowbtn .meta { grid-column: 2 / 4; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
  .rowbtn .meta .cite { font-family: var(--mono); font-size: 12.5px; }
  .rowbtn .why { grid-column: 2 / 4; color: var(--mut); font-size: 13px; line-height: 1.5; margin-top: 3px; max-width: 72ch;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rows > li.hot .rowbtn { background: var(--hover); box-shadow: inset 2px 0 0 var(--border-strong); }
  .opinion { margin-bottom: 20px; }
  .opinion > summary { color: var(--ink-2); font-size: 13px; cursor: pointer; padding: 8px 0; text-decoration: underline; text-underline-offset: 2px; }
  .opinion > summary:hover { color: var(--ink-1); }
  .opbody { background: var(--surface-1); border: 1px solid var(--hair); border-radius: 10px; padding: 14px 16px; max-height: 54vh; overflow-y: auto; }
  .opbody p { font: 400 13.5px/1.62 var(--serif); color: var(--ink-1); margin-bottom: 11px; }
  .opbody .opsrc { font-size: 11.5px; color: var(--mut); border-bottom: 1px solid var(--hair); padding-bottom: 8px; margin-bottom: 11px; }
  .opnote { font-size: 12.5px; color: var(--mut); }
  .opnote.bad { color: var(--ink-1); background: var(--amber-wash); border: 1px solid var(--amber); border-radius: 8px; padding: 9px 11px; }
  .opnote code { font-family: var(--mono); font-size: 12px; }
  .rowx { display: none; padding: 4px 16px 14px 46px; background: var(--card); box-shadow: inset 2px 0 0 var(--ink-1); }
  li.open .rowx { display: block; }
  .xline { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; font-size: 12.5px; }
  .xline .lbl { flex: none; width: 96px; font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--mut); }
  .xline .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .cchip { font-family: var(--mono); font-size: 12.5px; background: var(--card); border: 1px solid var(--hair); border-radius: 4px; padding: 1px 7px; }
  .xdiag { border-top: 1px solid var(--hair); margin-top: 8px; padding-top: 8px; font: 400 11.5px var(--mono); color: var(--faint); display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  .xdiag .act { font: 600 12.5px var(--sans); color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; }
  .xdiag .act:hover { color: var(--ink-1); }

  .footline { color: var(--mut); font-size: 12.5px; margin-top: 26px; }
  .footline .lnk { color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; margin-left: 8px; }

  /* ── the stage ── */
  canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #tooltip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; width: 340px; display: none; box-shadow: 0 4px 16px rgba(0,0,0,.20); z-index: 5; }
  #tooltip .t-name { font: 600 14px var(--serif); line-height: 1.25; }
  #tooltip .t-meta { color: var(--ink-2); font-size: 11.5px; margin-top: 2px; }
  #tooltip .t-meta .cite { font-family: var(--mono); }
  #tooltip .t-sec { margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--hair); font-size: 12px; line-height: 1.45; color: var(--ink-1); }
  #tooltip .t-lbl { display: block; font: 600 9.5px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--mut); margin-bottom: 2px; }
  /* the viewer speaking, not the court — italic keeps an editorial note from
     reading like the verbatim span above it */
  #tooltip .t-none { color: var(--mut); font-style: italic; }
  #tooltip .t-why { color: var(--ink-2); }
  /* the outcome chip: colour AND word, together, everywhere. */

<script>
  'use strict'
  if (!DATA) { document.body.textContent = 'No graph data injected — run: node graph.mjs build'; throw new Error('no data') }
  const nodes = DATA.nodes, edges = DATA.edges, M = DATA.metrics
  const TYPES = ['cites', 'authority', 'text']

  // ---- theme (embedding shell pins via ?theme=; standalone keeps toggle) ----
  const root = document.documentElement
  const PARAMS = new URLSearchParams(location.search)
  if (PARAMS.get('embed') === '1') root.dataset.embed = '1'
  const pinnedTheme = PARAMS.get('theme')
  if (pinnedTheme === 'light' || pinnedTheme === 'dark') {
    root.dataset.theme = pinnedTheme
    document.getElementById('themeBtn').style.display = 'none'
  } else {
    const t = localStorage.getItem('synergy-theme')
    if (t) root.dataset.theme = t
  }
  document.getElementById('themeBtn').onclick = () => {
    const dark = getComputedStyle(root).colorScheme.includes('dark')
    root.dataset.theme = dark ? 'light' : 'dark'
    localStorage.setItem('synergy-theme', root.dataset.theme)
    readCSSColors(); drawCv()
  }
  let C = {}
  function readCSSColors() {
    const s = getComputedStyle(document.body)
    const v = (n) => s.getPropertyValue(n).trim()
    C = { surface: v('--surface-1'), page: v('--page'), ink1: v('--ink-1'), ink2: v('--ink-2'),
      mut: v('--mut'), faint: v('--faint'), hair: v('--hair'),
      cites: v('--e-cites'), authority: v('--e-auth'), text: v('--e-text'), commander: v('--commander'),
      up: v('--o-up'), split: v('--o-split'), down: v('--o-down'),
      upA: v('--o-up-accent'), splitA: v('--o-split-accent'), downA: v('--o-down-accent') }
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readCSSColors(); drawCv() })

  // ---- language: the parsers that keep lab vocabulary off the primary surface ----
  const CIRCUITS = [['First', '1st Cir.'], ['Second', '2d Cir.'], ['Third', '3d Cir.'], ['Fourth', '4th Cir.'],
    ['Fifth', '5th Cir.'], ['Sixth', '6th Cir.'], ['Seventh', '7th Cir.'], ['Eighth', '8th Cir.'],
    ['Ninth', '9th Cir.'], ['Tenth', '10th Cir.'], ['Eleventh', '11th Cir.'],
    ['District of Columbia', 'D.C. Cir.'], ['Federal', 'Fed. Cir.']]
  function shortCourt(court) {
    if (!court) return ''
    for (const [word, abbr] of CIRCUITS) if (court.includes(word + ' Circuit')) return abbr
    return court
  }
  const GOV_RE = /^(?:united states|u\.?s\.?a?\.?|immigration|i\.?n\.?s\.?|sec\b|f\.?c\.?c\.?|state|people|commissioner|attorney general)/i
  function shortCase(name) {
    const sides = name.split(/\s+v\.?\s+/)
    if (sides.length !== 2) return name
    const pick = GOV_RE.test(sides[0]) && !GOV_RE.test(sides[1]) ? sides[1] : sides[0]
    const toks = pick.replace(/[,.]+$/, '').split(/\s+/)
    return toks[toks.length - 1].replace(/[^\w'’-]/g, '') || name
  }
  const topicWords = (t) => (t || '').replace(/-/g, ' ')
  const year = (s) => { const m = (s || '').match(/\b(?:18|19|20)\d{2}\b/); return m ? +m[0] : null }
  function fmtDate(s) {
    const m = (s || '').match(/(\d{4})-(\d{2})-(\d{2})/)
    if (!m) return s || ''
    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2] - 1]
    return `${+m[3]} ${mo} ${m[1]}`
  }
  // why -> 1-3 plain sentences; kills tokens that are just the case names ("liu")
  function whyParts(l, subj) {
    const o = nodes[l.id]
    const segs = (l.why || '').split(' · ')
    const out = { sentences: [], shared: [], terms: [], direct: null }
    const nameToks = new Set((subj.name + ' ' + o.name).toLowerCase().split(/[^a-z'’-]+/))
    for (const seg of segs) {
      let m
      if ((m = seg.match(/^(.+?) cites (.+)$/))) {
        out.direct = seg
        out.sentences.push(m[1] === subj.name ? 'This case cites it directly.' : 'Cites ' + shortCase(subj.name) + ' directly.')
      } else if ((m = seg.match(/^shared: (.+)$/))) {
        out.shared = m[1].split('; ')
        out.sentences.push(out.shared.length === 1
          ? `Relies on the same authority, ${out.shared[0]}.`
          : `Relies on ${out.shared.length} of the same authorities.`)
      } else if ((m = seg.match(/^terms: (.+)$/))) {
        out.terms = m[1].split(', ').filter((t) => !nameToks.has(t.toLowerCase())).slice(0, 3)
        if (out.terms.length) out.sentences.push(`Similar language: ${out.terms.join(', ')}.`)
      }
    }
    return out
  }
  const badgeFor = (l) => l.types.includes('cites') ? ['direct', 'direct citation'] :
    l.types.includes('authority') ? ['', 'shared authorities'] : ['', 'similar language']
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')

  // ---- method popover ----
  document.getElementById('scopeLine').textContent = DATA.scope
  document.getElementById('methodStats').textContent =
    'Three signals, weighted 3 / 2 / 1: one case citing the other, similar language, and authorities both rely on — each normalised to the largest value in this library. ' +
    'That order is the measured one: in this corpus a citation link landed in the same practice area 100% of the time (only 2 such links exist here), similar language 73.8%, shared authorities 55.3%, against 9.1% for a random pair. ' +
    'So that a case resembling everything does not count as relevant to everything, similar language and shared authorities are each divided by that case’s own average plus a floor; a direct citation is never generic, so it is counted as it stands, and authorities cited by almost every case are weighted down for the same reason. ' +
    `Coverage ${(M.coverage * 100).toFixed(0)}% · strength gini ${M.gini}. Scores are comparable only within one case's list.`

  // ---- state ----
  let subject = null          // node id or null: what the MAP is centred on
  let subjLinks = [], subjSet = new Set()
  // The list and the map no longer share one state. You can search for a second
  // case while the first is still on the map — which is the normal way a lawyer
  // uses this — so the pane you type in does not blow away the picture.
  let listMode = 'library'    // 'library' | 'subject' — what the LEFT pane shows
  let query = ''
  let activeTopic = null
  let exampleIdx = -1
  const newIds = nodes.filter((n) => n.kind === 'new').map((n) => n.id)
  const relatedCount = (n) => (n.synergy || []).length
  const missCount = (x) => (x.missing || []).length
  const announce = (msg) => { document.getElementById('announce').textContent = msg }

  // ---- library state ----
  const content = document.getElementById('content')
  function renderLibrary(q = '') {
    const query = q.trim().toLowerCase()
    let list = nodes.filter((n) => (!activeTopic || n.topic === activeTopic) &&
      (!query || (n.name + ' ' + (n.cite || '') + ' ' + n.topic).toLowerCase().includes(query)))
    // sort by something that varies: every node has exactly SYNERGY_TOP_N links, so the
    // old "related" sort was a 99-way tie that degenerated to file order
    list = [...list].sort((a, b) => missCount(b) - missCount(a) || a.name.localeCompare(b.name))
    const topics = [...new Set(nodes.map((n) => n.topic))].sort()
    content.innerHTML =
      `<div class="introrow">
        <span class="sub-line">The ${nodes.length} published federal appellate opinions that ship with the app. Open any one to put it at the centre of the map. &ldquo;To check&rdquo; counts the authorities its related cases rely on that it never cites.</span>
        <button class="cta" id="tryExample">${exampleIdx < 0 ? 'Show an example matter' : 'Show another example matter'}</button>
      </div>
      <div class="grouphead"><h2>The library</h2><span class="n">· ${list.length} of ${nodes.length} published opinions</span></div>
      <div class="sheet">${list.length ? list.map((n) =>
        `<button class="librow" data-id="${n.id}">
          <span class="nm">${odot(n)}${esc(n.name)}${n.kind === 'new' ? '<span class="exchip">Example matter</span>' : ''}${n.id === subject ? '<span class="exchip">on the map</span>' : ''}</span>
          <span class="meta">${oword(n)} · <span class="cite">${esc(n.cite || '')}</span>${n.court ? ' · ' + esc(shortCourt(n.court)) : ''}${year(n.date) ? ' · ' + year(n.date) : ''} · ${esc(topicWords(n.topic))}</span>
          <span class="rel">${missCount(n) ? missCount(n) + ' to check' : '—'}</span>
        </button>`).join('') :
        `<div class="noresults">No case matches &ldquo;${esc(q)}&rdquo;. Try a party name, a reporter citation (180 F.3d 957), or a topic.</div>`}</div>`
    lastMatches = list
    document.getElementById('tryExample').onclick = () => {
      if (!newIds.length) return
      exampleIdx = (exampleIdx + 1) % newIds.length
      setSubject(newIds[exampleIdx])
    }
    for (const el of content.querySelectorAll('.librow')) el.onclick = () => setSubject(+el.dataset.id)
  }

  // ---- the searcher, wired ONCE ----
  // The old search box lived inside the string renderLibrary() rebuilt on every
  // keystroke, so the input was destroyed under the caret and you could type
  // exactly one character. It is markup now, outside both renderers, so there is
  // nothing to restore and nothing to lose.
  let lastMatches = []
  const searchEl = document.getElementById('search')
  const chiprow = document.getElementById('chiprow')
  function renderChips() {
    const topics = [...new Set(nodes.map((x) => x.topic))].sort()
    chiprow.innerHTML = `<button class="tchip ${activeTopic === null ? 'on' : ''}" data-topic="">All</button>` +
      topics.map((t) => `<button class="tchip ${activeTopic === t ? 'on' : ''}" data-topic="${esc(t)}">${esc(topicWords(t))}</button>`).join('')
    for (const el of chiprow.querySelectorAll('.tchip')) el.onclick = () => {
      activeTopic = el.dataset.topic || null
      renderChips(); showLibrary(); drawCv()
    }
  }
  function renderList() {
    if (listMode === 'subject' && subject !== null) renderSubject()
    else renderLibrary(query)
    document.getElementById('listscroll').scrollTop = 0
  }
  function showLibrary() { listMode = 'library'; renderList() }
  searchEl.oninput = () => { query = searchEl.value; showLibrary() }
  searchEl.onkeydown = (ev) => { if (ev.key === 'Enter' && lastMatches.length) setSubject(lastMatches[0].id) }
  // ---- subject state ----
  function setSubject(id, opts) {
    const o = opts || {}
    subject = id
    subjLinks = id === null ? [] : (nodes[id].synergy || [])
    subjSet = new Set(subjLinks.map((l) => l.id))
    // The pointer has not moved, so whatever it was over it is still over. Clear
    // the hover only to force setHover past its no-op guard after renderList()
    // rebuilds the rows, then put it straight back.
    const wasOver = hoverNode
    hoverNode = null
    listMode = id === null ? 'library' : 'subject'
    renderList()
    updateMapChrome()
    if (wasOver !== null) {
      setHover(wasOver)
      // the card was written against the OLD subject: left alone it sits there
      // calling the case you just opened "rank 2" of the case it replaced
      tooltip.innerHTML = cardHtml(nodes[wasOver])
      fitCard(nodes[wasOver], cv.getBoundingClientRect().height - 10)
    }
    autoFit = true; fitView(); drawCv()
    if (id !== null) {
      const nd = nodes[id]
      announce(`${subjLinks.length} related cases for ${nd.name}` +
        ((nd.missing || []).length ? `; ${nd.missing.length} authorities not cited.` : '.'))
      if (o.focus !== false) content.querySelector('.subjcard')?.focus?.()
    }
  }
  function rowHtml(l, k, subj) {
    const o = nodes[l.id]
    const w = whyParts(l, subj)
    const [bcls, bword] = badgeFor(l)
    const badgeText = bcls === 'direct' ? 'cites ' + shortCase(subj.name).toLowerCase() : bword
    return `<li data-rank="${k}" data-id="${o.id}">
      <button class="rowbtn" aria-expanded="false">
        <span class="rk">${k + 1}</span>
        <span class="nm">${odot(o)}${esc(o.name)}</span>
        <span class="badge ${bcls}">${esc(badgeText)}</span>
        <span class="meta">${oword(o)} · <span class="cite">${esc(o.cite || '')}</span>${o.court ? ' · ' + esc(shortCourt(o.court)) : ''}${year(o.date) ? ' · ' + year(o.date) : ''} · ${esc(topicWords(o.topic))}</span>
        <span class="why">${esc(w.sentences.join(' ') || 'Connected within your library.')}</span>
      </button>
      <div class="rowx">
        ${w.shared.length ? `<div class="xline"><span class="lbl">Shared authorities</span><span class="chips">${w.shared.map((c) => `<span class="cchip">${esc(c)}</span>`).join('')}<button class="copybtn" data-copy="${esc(w.shared.join('; '))}">Copy</button></span></div>` : ''}
        ${w.terms.length ? `<div class="xline"><span class="lbl">Overlapping language</span><span>${esc(w.terms.join(' · '))}</span></div>` : ''}
        ${w.direct ? `<div class="xline"><span class="lbl">Direct citation</span><span>${esc(w.direct)}</span></div>` : ''}
        <div class="xdiag">
          <span>Ranked ${k + 1} of ${subjLinks.length} · internal score ${l.score.toFixed(3)} — comparable only within this list</span>
          <button class="act" data-subj="${o.id}">Make this the subject →</button>
          <button class="act" data-map="${o.id}">Show in map</button>
        </div>
      </div>
    </li>`
  }
  function renderSubject() {
    const n = nodes[subject]
    const cy = year(n.date)
    const groups = { earlier: [], later: [], undated: [] }
    subjLinks.forEach((l, k) => {
      const oy = year(nodes[l.id].date)
      const g = cy === null || oy === null ? 'undated' : oy <= cy ? 'earlier' : 'later'
      groups[g].push(rowHtml(l, k, n))
    })
    const short = shortCase(n.name)
    const miss = n.missing || []
    content.innerHTML =
      `<div class="backbar"><button class="back" id="backBtn">← All cases</button></div>
      <div class="subjcard" tabindex="-1">
        <h2>${esc(n.name)}${n.kind === 'new' ? '<span class="exchip">Example matter</span>' : ''} ${ochip(n)}</h2>
        <div class="meta"><span class="cite">${esc(n.cite || '')}</span>${n.court ? ' · ' + esc(shortCourt(n.court)) : ''}${n.date ? ' · ' + esc(fmtDate(n.date)) : ''} · ${esc(topicWords(n.topic))}</div>
        ${n.kind === 'new' ? `<div class="count">${esc(n.name)} is a real published opinion, introduced into this library the way a new matter would arrive on your desk. It stands in for a matter of yours, so you can see the view before you pick a case.</div>` : ''}
        <div class="count">The ${subjLinks.length} strongest connections in this library, closest first.</div>
      </div>
      <details class="opinion" id="opinion"><summary>Read the opinion</summary><div class="opbody" id="opbody"></div></details>
      ${miss.length ? `<div class="misscard">
        <div class="ghead"><span>Authorities ${esc(short)} doesn&rsquo;t cite</span><span>${miss.length} to check</span></div>
        <div class="glead">The related cases below rely on these; ${esc(short)} does not cite them. Checked against the ${nodes.length} opinions in this library only &mdash; this is not a citator, and nothing here checks whether an authority is still good law.</div>
        ${miss.map((x) => {
          const names = (x.by || []).slice(0, 3).map((id) => `<i>${esc(shortCase(nodes[id].name))}</i>`)
          const byTxt = names.length
            ? `Relied on by ${names.join(', ')}${(x.by || []).length > 3 ? ` and ${x.by.length - 3} more` : ''}`
            : `Relied on by ${x.n} of the ${subjLinks.length} related cases below`
          return `<div class="missrow"><span class="mc">${esc(x.name)}</span><span class="by">${byTxt}</span><button class="copybtn" data-copy="${esc(x.name)}">Copy</button></div>`
        }).join('')}
      </div>` : `<div class="okcard">
        <div class="ghead"><span>Nothing flagged</span></div>
        <div class="glead">No authority is relied on by two or more of the related cases below without also appearing in ${esc(short)}. Citation extraction is a lower bound &mdash; the archived text is truncated &mdash; and this is not a citator.</div>
      </div>`}
      ${cy === null && subjLinks.length
        ? `<div class="grouphead"><h2>Related cases</h2><span class="n">· ${subjLinks.length}</span></div><div class="sheet"><ul class="rows">${[...groups.earlier, ...groups.later, ...groups.undated].join('')}</ul></div>`
        : `${groups.earlier.length ? `<div class="grouphead"><h2>Decided before or alongside this case</h2><span class="n">· ${groups.earlier.length}</span><div class="sub">Same year as <i>${esc(short)}</i> or earlier. Ordered by connection strength, not by date.</div></div><div class="sheet"><ul class="rows">${groups.earlier.join('')}</ul></div>` : ''}
          ${groups.later.length ? `<div class="grouphead"><h2>Decided after</h2><span class="n">· ${groups.later.length}</span><div class="sub">How courts have used this ground since.</div></div><div class="sheet"><ul class="rows">${groups.later.join('')}</ul></div>` : ''}
          ${groups.undated.length ? `<div class="grouphead"><h2>Undated</h2><span class="n">· ${groups.undated.length}</span><div class="sub">No date parsed from the header.</div></div><div class="sheet"><ul class="rows">${groups.undated.join('')}</ul></div>` : ''}`}
      ${subjLinks.length === 0 ? '<div class="sheet"><div class="noresults">No related cases found — this document stands alone in the current library.</div></div>' : ''}`
    document.getElementById('backBtn').onclick = () => showLibrary()
    const det = document.getElementById('opinion')
    det.ontoggle = () => { if (det.open) loadOpinion(n.file, document.getElementById('opbody')) }
    for (const li of content.querySelectorAll('.rows > li')) {
      const btn = li.querySelector('.rowbtn')
      btn.onclick = () => { li.classList.toggle('open'); btn.setAttribute('aria-expanded', li.classList.contains('open')) }
      li.addEventListener('mouseenter', () => setHover(+li.dataset.id))
      li.addEventListener('mouseleave', () => setHover(null))
    }
    for (const el of content.querySelectorAll('[data-subj]')) el.onclick = (ev) => { ev.stopPropagation(); setSubject(+el.dataset.subj) }
    for (const el of content.querySelectorAll('[data-map]')) el.onclick = (ev) => {
      ev.stopPropagation(); focusNode(+el.dataset.map); setHover(+el.dataset.map)
    }
    for (const el of content.querySelectorAll('[data-copy]')) el.onclick = (ev) => {
      ev.stopPropagation()
      navigator.clipboard?.writeText(el.dataset.copy)
      el.textContent = 'Copied'; setTimeout(() => { el.textContent = 'Copy' }, 1200)
    }
  }

  // ---- force layout (unchanged physics; 220 ticks at boot, then frozen at alpha 0.02) ----
  let seed = 42
  const rand = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff
  const W = 1200, H = 900
  const clusters = [...new Set(nodes.map((n) => n.cluster))]
  for (const n of nodes) {
    const a = (clusters.indexOf(n.cluster) / clusters.length) * Math.PI * 2
    n.x = W / 2 + Math.cos(a) * 280 + (rand() - 0.5) * 120
    n.y = H / 2 + Math.sin(a) * 280 + (rand() - 0.5) * 120
    n.vx = 0; n.vy = 0
    n.r = 4 + Math.sqrt(n.strength) * 3.2
  }
  const maxW = {}
  for (const t of TYPES) maxW[t] = Math.max(...edges.filter((e) => e.type === t).map((e) => e.w), 1)
  for (const e of edges) e.nw = e.w / maxW[e.type]
  let alpha = 1
  let dragNode = null
  function tick() {
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i]
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j]
        let dx = a.x - b.x, dy = a.y - b.y
        let d2 = dx * dx + dy * dy
        if (d2 < 1) { dx = rand() - 0.5; dy = rand() - 0.5; d2 = 1 }
        const f = Math.min(1200 / d2, 6) * alpha
        const d = Math.sqrt(d2)
        a.vx += (dx / d) * f; a.vy += (dy / d) * f
        b.vx -= (dx / d) * f; b.vy -= (dy / d) * f
      }
    }
    for (const e of edges) {
      const a = nodes[e.s], b = nodes[e.t]
      const dx = b.x - a.x, dy = b.y - a.y
      const d = Math.sqrt(dx * dx + dy * dy) || 1
      const rest = 120 - 60 * e.nw
      const f = ((d - rest) / d) * 0.02 * (0.4 + e.nw) * alpha
      a.vx += dx * f; a.vy += dy * f
      b.vx -= dx * f; b.vy -= dy * f
    }
    for (const n of nodes) {
      n.vx += (W / 2 - n.x) * 0.004 * alpha
      n.vy += (H / 2 - n.y) * 0.004 * alpha
      if (n === dragNode) { n.vx = 0; n.vy = 0; continue }
      n.x += n.vx *= 0.85
      n.y += n.vy *= 0.85
    }
    alpha = Math.max(alpha * 0.995, 0.02)
  }
  for (let i = 0; i < 220; i++) tick()
  alpha = 0.02

  // ---- map chrome ----
  // The 296px rail radial that used to sit here is gone. It was a second
  // renderer with its own geometry and its own hit test, drawn at a size the
  // owner called "too small … doesn't feel powerful". There is one map now, it
  // occupies 60% of the lane, and full screen is a CSS class on its container —
  // so painter and hit test cannot drift, because there is only one of each.
  const mapPane = document.getElementById('mapPane')
  const mapStage = document.getElementById('mapStage')
  const mapTitle = document.getElementById('mapTitle')
  const mapLeg = document.getElementById('mapLeg')
  const LEG_OUTCOME = '<br><span class="lgl">Node colour = what happened to the decision below:</span>'
    + '<span class="lg" style="--c:var(--o-up);--r:var(--o-up-accent)">upheld</span>'
    + '<span class="lg" style="--c:var(--o-split);--r:var(--o-split-accent)">split &mdash; part upheld, part undone</span>'
    + '<span class="lg" style="--c:var(--o-down);--r:var(--o-down-accent)">overturned</span>'
    + '<span class="lg hollow">no disposition extracted</span>'
  const LEG_SUBJ = '<span class="lgl">Gold ring = the case on the map; its 12 strongest connections are numbered by rank. Line colour = why:</span>'
    + '<span class="lg" style="--c:var(--e-cites)">cites</span>'
    + '<span class="lg" style="--c:var(--e-auth)">shared authorities</span>'
    + '<span class="lg" style="--c:var(--e-text)">similar language</span>'
    + LEG_OUTCOME
  const LEG_ALL = '<span class="lgl">Every case in the library, placed by how they connect. Diamond = example matter. Click any node to open it.</span>'
    + LEG_OUTCOME
  function updateMapChrome() {
    mapTitle.textContent = subject === null
      ? `${M.nodes} cases \u00b7 ${M.edges} connections`
      : `${shortCase(nodes[subject].name)} \u00b7 ${subjLinks.length} strongest of ${M.nodes}`
    mapLeg.innerHTML = subject === null ? LEG_ALL : LEG_SUBJ
  }

  // ---- the map ----
  const cv = document.getElementById('cv')
  const ctx = cv.getContext('2d')
  let view = { x: 0, y: 0, k: 1 }
  let autoFit = true
  let hoverNode = null
  let rafOn = false
  function fitView() {
    const rect = cv.getBoundingClientRect()
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
    // the WHOLE library, always — fitting to subject+neighbours left the other 87
    // nodes off-viewport, where they piled into a crushed band along the edge
    for (const n of nodes) {
      minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x)
      minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y)
    }
    if (!isFinite(minX)) { minX = 0; minY = 0; maxX = W; maxY = H }
    // Margins in SCREEN pixels, not world units. The old padding was 90 world
    // units, which the zoom divides: at fit-the-whole-library scale it came out
    // near 50px, and a case name needs about 150. Every rightmost label ran off
    // the pane. Reserve the room in the space the text is actually drawn in.
    const mx = Math.min(158, rect.width * 0.17), my = 24
    const bw = Math.max(maxX - minX, 1), bh = Math.max(maxY - minY, 1)
    view.k = Math.min((rect.width - mx * 2) / bw, (rect.height - my * 2) / bh, 2.4)
    view.x = rect.width / 2 - ((minX + maxX) / 2) * view.k
    view.y = rect.height / 2 - ((minY + maxY) / 2) * view.k
  }
  function resize() {
    const rect = cv.getBoundingClientRect()
    const dpr = devicePixelRatio || 1
    cv.width = rect.width * dpr
    cv.height = rect.height * dpr
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  }
  const visible = (n) => !activeTopic || n.topic === activeTopic
  function nodeAlpha(n) {
    if (subject !== null) {
      if (n.id === subject) return 1
      return subjSet.has(n.id) ? 0.95 : 0.15
    }
    return visible(n) ? 0.95 : 0.12
  }
  const synMax = Math.max(...nodes.map((n) => (n.synergy && n.synergy[0] ? n.synergy[0].score : 0)), 0.001)
  const shortLabel = (s) => (s.length > 34 ? s.slice(0, 32) + '…' : s)
  function drawCv() {
    const rect = cv.getBoundingClientRect()
    ctx.clearRect(0, 0, rect.width, rect.height)
    ctx.save()
    ctx.translate(view.x, view.y)
    ctx.scale(view.k, view.k)
    for (const e of edges) {
      const a = nodes[e.s], b = nodes[e.t]
      let al = 0.18 + 0.5 * e.nw
      if (subject !== null) al = e.s === subject || e.t === subject ? 0.55 : 0.03
      else if (activeTopic && !(visible(a) && visible(b))) al = 0.04
      if (hoverNode !== null && (e.s === hoverNode || e.t === hoverNode)) al = 0.9
      ctx.globalAlpha = al
      ctx.strokeStyle = C[e.type]
      ctx.lineWidth = (0.6 + 2.4 * e.nw) / view.k
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke()
    }
    if (subject !== null) {
      const c = nodes[subject]
      for (const l of subjLinks) {
        const b = nodes[l.id]
        ctx.globalAlpha = 0.85
        ctx.strokeStyle = C[l.types[0]] || C.ink2
        ctx.lineWidth = (0.8 + 2.6 * (l.score / synMax)) / view.k
        ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(b.x, b.y); ctx.stroke()
      }
    }
    for (const n of nodes) {
      const isSubj = n.id === subject
      const r = isSubj ? n.r * 1.5 + 3 : n.r
      // Outcome drives the fill, and a node with no extracted disposition is drawn
      // HOLLOW rather than tinted — the map declining to say is a different KIND of
      // mark, not a fourth colour competing with three others. (As a tint it lost:
      // 8.1 dE00 from upheld under deuteranopia, so a refusal looked like an
      // affirmance.) Emphasis for subject/hover comes from the gold ring, the label
      // and the edge highlight, never from the fill, because the fill carries meaning.
      const oo = oc(n)
      // A dim floor for the FILL only. At the old 0.15 the scale composited away
      // entirely — upheld vs overturned measured 2.2 dE00 under deuteranopia, and 87
      // of 99 nodes are dimmed in commander view. Edges keep their own dim, so the
      // out-of-scope field still reads as background.
      ctx.globalAlpha = Math.max(nodeAlpha(n), 0.55)
      ctx.fillStyle = oo ? C[oo.c] : C.surface
      ctx.strokeStyle = oo ? C[oo.c + "A"] : isSubj || n.id === hoverNode ? C.ink1 : C.ink2
      ctx.lineWidth = (oo ? 1.4 : 1.6) / view.k
      ctx.beginPath()
      if (n.kind === 'new') {
        ctx.save(); ctx.translate(n.x, n.y); ctx.rotate(Math.PI / 4); ctx.rect(-r, -r, r * 2, r * 2); ctx.restore()
      } else ctx.arc(n.x, n.y, r, 0, Math.PI * 2)
      // knockout first so the node lifts off the edges, then the fill, then its rim
      const keep = ctx.strokeStyle
      ctx.save(); ctx.strokeStyle = C.surface; ctx.lineWidth = 3.2 / view.k; ctx.stroke(); ctx.restore()
      ctx.strokeStyle = keep
      ctx.fill(); ctx.stroke()
      if (isSubj) {
        ctx.strokeStyle = C.commander
        ctx.globalAlpha = 1; ctx.lineWidth = 2.5 / view.k
        ctx.beginPath(); ctx.arc(n.x, n.y, r + 5 / view.k, 0, Math.PI * 2); ctx.stroke()
        ctx.globalAlpha = 0.45; ctx.lineWidth = 1.5 / view.k
        ctx.beginPath(); ctx.arc(n.x, n.y, r + 10 / view.k, 0, Math.PI * 2); ctx.stroke()
      }
    }
    ctx.globalAlpha = 1
    ctx.font = `${11 / view.k}px "IBM Plex Sans", sans-serif`
    // ordered, not a bare Set: subject and hover claim their space first, then
    // neighbours by rank, and a label that would land on one already drawn is dropped
    const labelled = []
    const push = (id) => { if (id !== null && !labelled.includes(id)) labelled.push(id) }
    push(subject); push(hoverNode)
    if (subject !== null) for (const l of subjLinks) push(l.id)
    const placed = []
    const hit = (b) => placed.some((p) => !(b.x > p.x + p.w || b.x + b.w < p.x || b.y > p.y + p.h || b.y + b.h < p.y))
    // the subject also wears two gold rings at +5 and +10, so clear those too
    const drawnR = (n) => (n.id === subject ? n.r * 1.5 + 3 + 12 / view.k : n.r)
    // reserve the nodes themselves first: a name printed across a dot is worse
    // than no name, and the subject's dot is drawn larger than its stored radius
    for (const id of labelled) {
      const n = nodes[id]
      if (nodeAlpha(n) < 0.5) continue
      const rr = drawnR(n) + 3 / view.k
      placed.push({ x: n.x - rr, y: n.y - rr, w: rr * 2, h: rr * 2 })
    }
    for (const id of labelled) {
      const n = nodes[id]
      if (nodeAlpha(n) < 0.5) continue
      // the rank is what ties a node to its row in the list beside it
      const rk = subject === null ? -1 : subjLinks.findIndex((l) => l.id === id)
      const isS = id === subject
      const txt = (rk >= 0 ? (rk + 1) + '. ' : '') + shortLabel(n.name)
      ctx.font = `${isS ? 600 : 400} ${(isS ? 12.5 : 11) / view.k}px "IBM Plex Sans", sans-serif`
      const tw = ctx.measureText(txt).width
      const ly = n.y + 4 / view.k
      const cands = [
        { x: n.x + drawnR(n) + 6 / view.k, y: ly },
        { x: n.x - drawnR(n) - 6 / view.k - tw, y: ly },
      ]
      // The subject's own name is the one label that must never be dropped — a map
      // whose centre is unnamed is a map of nothing. It gets placements no other
      // node has: stacked rows under and over its gold rings, each pre-clamped in x
      // so the screen-edge test can never be what rejects them. Only the row is in
      // question, so the search is over y.
      if (isS) {
        const cx = Math.min(Math.max(n.x - tw / 2, (3 - view.x) / view.k), (rect.width - 3) / view.k - tw)
        for (const dy of [16, 31, 46, -19, -34]) cands.push({ x: cx, y: n.y + (dy > 0 ? drawnR(n) : -drawnR(n)) + dy / view.k })
      }
      let at = null
      for (const c of cands) {
        if (hit({ x: c.x, y: c.y - 9 / view.k, w: tw, h: 13 / view.k })) continue
        // The canvas edge is a constraint the collision test cannot see: it works
        // in world units, and whether a name fits is a fact about SCREEN pixels.
        // Without this the rightmost names ran off the pane mid-word.
        const sx = view.x + c.x * view.k
        if (sx < 3 || sx + tw * view.k > rect.width - 3) continue
        at = c; break
      }
      // every row taken: the subject still gets its name, on the first row under
      // the rings. Any other node would rather show nothing than a smear.
      if (!at && isS) at = cands[2]
      if (!at) continue
      placed.push({ x: at.x, y: at.y - 9 / view.k, w: tw, h: 13 / view.k })
      ctx.fillStyle = isS ? C.commander : id === hoverNode ? C.ink1 : C.ink2
      ctx.fillText(txt, at.x, at.y)
    }
    ctx.restore()
  }
  // The physics ran 220 ticks at boot and is frozen at alpha 0.02, so there is
  // no permanent rAF loop burning a core behind a still picture. A drag or a
  // reset re-heats it; the loop then runs until it settles and stops itself.
  function loop() {
    if (alpha > 0.021) { tick(); if (autoFit) fitView(); drawCv(); requestAnimationFrame(loop) }
    else { drawCv(); rafOn = false }
  }
  function kick() { if (!rafOn) { rafOn = true; requestAnimationFrame(loop) } }

  // Full screen asks for the real thing first. In the app this lane is an iframe,
  // and position:fixed can only ever cover the iframe — the 224px nav rail and the
  // 48px header would stay, which is not what "full screen" means to anyone.
  // requestFullscreen covers the monitor. It needs allow="fullscreen" on the
  // iframe (App.tsx) plus a user gesture; where it is refused the CSS class is the
  // fallback, and the button behaves identically either way.
  const isFull = () => !!document.fullscreenElement || mapPane.classList.contains('full')
  async function setFull(on) {
    if (on) {
      try { await mapPane.requestFullscreen?.() } catch (e) { /* fall through to the class */ }
      if (!document.fullscreenElement) mapPane.classList.add('full')
    } else {
      if (document.fullscreenElement) { try { await document.exitFullscreen() } catch (e) { /* already out */ } }
      mapPane.classList.remove('full')
    }
    syncFull()
  }
  function syncFull() {
    const on = isFull()
    const btn = document.getElementById('fullBtn')
    btn.textContent = on ? 'Exit full screen' : 'Full screen'
    btn.setAttribute('aria-pressed', String(on))
    resize(); if (autoFit) fitView(); drawCv()
    announce(on ? 'Map full screen.' : 'Map back in the panel.')
  }
  // Esc and F11 leave native full screen without going through the button, so the
  // label has to follow the document, not our own record of what we asked for
  addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) mapPane.classList.remove('full')
    syncFull()
  })
  document.getElementById('fullBtn').onclick = () => setFull(!isFull())
  document.getElementById('resetView').onclick = () => { autoFit = true; alpha = Math.max(alpha, 0.1); fitView(); kick() }

  // pan a node to the middle without changing what is selected
  function focusNode(id, k) {
    const nd = nodes[id]
    autoFit = false
    view.k = k || Math.max(view.k, 1.6)
    const rect = cv.getBoundingClientRect()
    view.x = rect.width / 2 - nd.x * view.k
    view.y = rect.height / 2 - nd.y * view.k
    drawCv()
  }

  addEventListener('resize', () => { resize(); if (autoFit) fitView(); drawCv() })
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => { resize(); if (autoFit) fitView(); drawCv() }).observe(mapStage)

  // map interactions: pan / zoom / drag / hover card / click-to-open
  const toWorld = (mx, my) => [(mx - view.x) / view.k, (my - view.y) / view.k]
  function pick(mx, my) {
    const [x, y2] = toWorld(mx, my)
    let best = null, bd = Infinity
    for (const n of nodes) {
      const d = Math.hypot(n.x - x, n.y - y2)
      if (d < n.r + 5 && d < bd) { best = n.id; bd = d }
    }
    return best
  }
  const tooltip = document.getElementById('tooltip')
  let panning = false, px = 0, py = 0
  cv.addEventListener('pointerdown', (ev) => {
    const id = pick(ev.offsetX, ev.offsetY)
    if (id !== null) { dragNode = nodes[id]; alpha = Math.max(alpha, 0.25); kick() }
    else panning = true
    px = ev.offsetX; py = ev.offsetY
    cv.setPointerCapture(ev.pointerId)
  })
  cv.addEventListener('pointermove', (ev) => {
    if (dragNode) {
      const [x, y2] = toWorld(ev.offsetX, ev.offsetY)
      dragNode.x = x; dragNode.y = y2
      alpha = Math.max(alpha, 0.2); kick()
      return
    }
    if (panning) {
      if (Math.hypot(ev.offsetX - px, ev.offsetY - py) > 2) autoFit = false
      view.x += ev.offsetX - px; view.y += ev.offsetY - py
      px = ev.offsetX; py = ev.offsetY
      drawCv()
      return
    }
    const id = pick(ev.offsetX, ev.offsetY)
    setHover(id)
    if (id !== null) {
      const n = nodes[id]
      tooltip.innerHTML = cardHtml(n)
      tooltip.style.display = 'block'
      const mrect = cv.getBoundingClientRect()
      if (!fitCard(n, mrect.height - 10)) {
        // the map is too short for even the smallest card; the list beside it
        // carries the same case in full, so this stays out of the way
        tooltip.style.display = 'none'
        cv.style.cursor = 'pointer'
        return
      }
      // keep the whole card inside the stage, on both axes
      tooltip.style.left = Math.max(4, Math.min(ev.offsetX + 14, mrect.width - 352)) + 'px'
      tooltip.style.top = Math.max(4, Math.min(ev.offsetY + 14, mrect.height - tooltip.offsetHeight - 6)) + 'px'
      cv.style.cursor = 'pointer'
    } else { tooltip.style.display = 'none'; cv.style.cursor = panning ? 'grabbing' : 'default' }
  })
  cv.addEventListener('pointerup', (ev) => {
    // a click that did not drag is "open this case" — the owner's rule
    if (dragNode && Math.hypot(ev.offsetX - px, ev.offsetY - py) < 4) setSubject(dragNode.id)
    dragNode = null; panning = false
  })
  // Leaving the canvas fires no pointermove on it, so the card would stay parked
  // over the map while the cursor was off in the list — describing a node nobody
  // is pointing at any more.
  cv.addEventListener('pointerleave', () => {
    if (panning || dragNode) return
    tooltip.style.display = 'none'
    setHover(null)
  })
  cv.addEventListener('wheel', (ev) => {
    ev.preventDefault()
    autoFit = false
    const f = ev.deltaY < 0 ? 1.15 : 1 / 1.15
    const [wx, wy] = toWorld(ev.offsetX, ev.offsetY)
    view.k *= f
    view.x = ev.offsetX - wx * view.k
    view.y = ev.offsetY - wy * view.k
    drawCv()
  }, { passive: false })

  // edge table
  document.querySelector('#edgeTable tbody').innerHTML = [...edges]
    .sort((a, b) => b.nw - a.nw)
    .map((e) => `<tr><td>${esc(nodes[e.s].name)}</td><td>${esc(nodes[e.t].name)}</td><td>${e.type}</td><td>${e.w}</td><td>${esc(e.detail || '')}</td></tr>`)
    .join('')

  // ---- hover: one identity, both panes ----
  // A node and its row are the same thing hovered from two directions, so they
  // share one variable. Two would drift the moment either pane re-rendered.
  function setHover(id) {
    if (id === hoverNode) return
    hoverNode = id
    for (const el of content.querySelectorAll('.rows > li')) el.classList.toggle('hot', id !== null && +el.dataset.id === id)
    drawCv()
  }

  // ---- outcome: one axis, three values, the same words everywhere ----
  // Built at build time by facets.mjs from the VERBATIM disposition span, never
  // from the summary. A node with no extracted disposition has no outcome and
  // gets no colour — the map says nothing rather than guessing.
  const OUTCOME = {
    stands: { cls: 'up', word: 'Upheld', c: 'up',
      long: 'the decision below was left in place (affirmed, or the petition denied)' },
    mixed: { cls: 'split', word: 'Split', c: 'split',
      long: 'part of the decision below stands and part was undone' },
    disturbed: { cls: 'down', word: 'Overturned', c: 'down',
      long: 'the decision below was undone (reversed or vacated)' },
  }
  const oc = (nd) => OUTCOME[nd.outcome] || null
  const NO_OUTCOME_LONG = 'no disposition could be extracted from this file, so the map says nothing'
  const ochip = (nd) => {
    const o = oc(nd)
    return o ? '<span class="ochip ' + o.cls + '" title="' + o.long + '">' + o.word + '</span>' : ''
  }
  // A card with no chip reads as "no outcome worth reporting". These two say which kind of
  // silence it is. Both are the hollow mark, matching the map and the list rows.
  const ochipNone = (word, why) => '<span class="ochip none" title="' + why + '">' + word + '</span>'
  const odot = (nd) => {
    const o = oc(nd)
    return '<span class="odot ' + (o ? o.cls : 'none') + '" aria-hidden="true"></span>'
  }
  // The canvas has no text alternative; the list beside it is the text alternative. A bare
  // coloured dot with a title= attribute is not one — title is not an accessible name on a
  // span, never appears on touch, and says nothing at all to a colour-deficient reader. So
  // the rows carry the word, and the dot beside it is decoration.
  const oword = (nd) => {
    const o = oc(nd)
    return '<span class="oword ' + (o ? o.cls : 'none') + '" title="' + (o ? o.long : NO_OUTCOME_LONG) + '">'
      + (o ? o.word : 'Not extracted') + '</span>'
  }

  // ---- the hover card ----
  // The bar set for this card: enough to say what the case is about and how it
  // came out, without opening it. Two of those fields, `synopsis` and
  // `disposition`, are per-node BUILD products (facets.mjs) — VERBATIM spans of
  // the opinion, never paraphrase and never a model. A disposition is the one
  // thing here a litigator might act on without opening the case, so it is
  // printed only when the build actually extracted one.
  //
  // A refusal is printed too. Showing nothing would read as "this case has no
  // outcome"; the build knows why it declined and says so. 88 of 99 opinions
  // yield a disposition, 11 do not — the reasons are the three below.
  const NO_DISP = {
    'no-operative-disposition-found':
      'The text held here never states one in the court’s own words.',
    'conflicting-dispositions-in-opinion':
      'Two passages state different outcomes. Nothing is shown rather than pick one.',
    'multiple-appeals-single-outcome-in-truncated-text':
      'More than one appeal is decided here, and the text is cut short — one line would not cover them.',
  }

  // syn: undefined = the whole synopsis; a string = that much of it, shortened by
  // fitCard below; null = it did not fit at all. compact = the stage is too small
  // for any of it, so the card carries identity only. The disposition is never
  // shortened at any tier — see fitCard.
  function cardHtml(nd, syn, compact) {
    const rk = subject === null ? -1 : subjLinks.findIndex((l) => l.id === nd.id)
    const link = rk >= 0 ? subjLinks[rk] : null
    const why = link ? whyParts(link, nodes[subject]).sentences.join(' ') : ''
    const sec = (lbl, body, cls, secCls) =>
      `<div class="t-sec ${secCls || ''}"><span class="t-lbl">${lbl}</span><span class="${cls || ''}">${body}</span></div>`
    let h = `<div class="t-name">${esc(nd.name)}${rk >= 0 ? `<span class="t-rank">rank ${rk + 1}</span>` : ''}</div>`
      + `<div class="t-meta"><span class="cite">${esc(nd.cite || 'no citation in header')}</span>`
      + `${nd.court ? ' \u00b7 ' + esc(shortCourt(nd.court)) : ''}${nd.date ? ' \u00b7 ' + esc(fmtDate(nd.date)) : ''} \u00b7 ${esc(topicWords(nd.topic))}</div>`
    if (compact) return h + sec('', 'This window is too small to hold the summary and the disposition. Click to open the case.', 't-none') + '<div class="t-open">Click to open this case.</div>'
    if (syn === null) h += sec('What it is about', 'Too long for this window — open the case.', 't-none')
    else if (syn !== undefined) h += sec('What it is about · opening lines', esc(syn) + '…')
    else if (nd.synopsis) h += sec('What it is about', esc(nd.synopsis))
    // Disposition, in three states: extracted / extracted from text the archive
    // cut / refused. The cut-short tag rides the label because it qualifies the
    // span rather than adding to it — a later passage could have said more.
    const cut = nd.sourceTruncated ? ' <span class="t-cut">· source text is cut short</span>' : ''
    const oo = oc(nd)
    if (nd.disposition) {
      // A disposition whose only operative verb is a bare remand does not settle whether the
      // decision below survived — a court can remand having affirmed, and remand having
      // reversed. outcomeClass returns null there and the node stays hollow; say so.
      const chip = oo ? ochip(nd) : ochipNone('Direction not stated',
        'the court\u2019s words here do not settle whether the decision below survived \u2014 a remand alone can follow either an affirmance or a reversal')
      h += sec('Disposition' + cut + ' ' + chip, esc(nd.disposition), '', oo ? 'o-' + oo.cls : '')
    } else if (nd.dispositionUnavailable) {
      h += sec('Disposition not extracted ' + ochipNone('Not extracted', NO_OUTCOME_LONG),
        esc(NO_DISP[nd.dispositionUnavailable] || nd.dispositionUnavailable) +
        (nd.sourceTruncated && nd.dispositionUnavailable === 'no-operative-disposition-found'
          ? ' The archive cut this copy short, so the ruling may sit past the cut.' : ''),
        't-none')
    }
    if (why) h += sec('Why it ranks here', esc(why), 't-why')
    else if (nd.id === subject) h += sec('On the map', 'The case everything else is ranked against.', 't-why')
    else h += sec('In this library', `${relatedCount(nd)} ranked connections \u00b7 ${missCount(nd) ? missCount(nd) + ' authorities to check' : 'nothing flagged'}`, 't-why')
    return h + '<div class="t-open">Click to open this case.</div>'
  }

  // A card taller than the map has nowhere to go: it is pointer-events:none, so
  // nobody can scroll it, and the clamp below would pin it to the top and let the
  // rest run off the bottom unseen. Something has to give, and it is never the
  // disposition — half a verdict read as whole is the worst thing this card could
  // do. The synopsis gives instead: it is already the opening of a paragraph, so
  // it drops whole sentences and the label says it was shortened.
  const SENT_END = /([.!?])(["'’”)\]]*)\s+(?=[A-Z“"'(\[§])/g
  function synSentences(t) {
    const cuts = []
    let m
    SENT_END.lastIndex = 0
    while ((m = SENT_END.exec(t)) !== null) {
      const before = t.slice(0, m.index)
      const tok = (before.match(/([A-Za-z.’']+)$/) || [''])[0]
      // "Inc." "Cir." "U.S.C." and a bare initial are not sentence ends
      if (/^[A-Za-z]$/.test(tok) || /[A-Za-z]\.[A-Za-z]/.test(tok)) continue
      if (/^(?:v|vs|no|nos|inc|corp|co|ltd|llc|llp|cir|ct|app|id|cf|jr|sr|mr|mrs|ms|dr|st|al|ex|rel|ass’n|assn|dep’t|dept)$/i.test(tok.replace(/\.$/, ''))) continue
      cuts.push(m.index + m[0].length)
    }
    return cuts
  }
  function fitCard(nd, avail) {
    if (tooltip.offsetHeight <= avail) return true
    const t = nd.synopsis || ''
    // whole sentences first, then word boundaries — a shortened synopsis still
    // orients a reader, an absent one does not
    const cuts = synSentences(t)
    for (const frac of [0.75, 0.5, 0.3, 0.18]) {
      const w = t.slice(0, Math.round(t.length * frac)).lastIndexOf(' ')
      if (w > 40) cuts.push(w)
    }
    cuts.sort((a, b) => a - b)
    for (let i = cuts.length - 1; i >= 0; i--) {
      tooltip.innerHTML = cardHtml(nd, t.slice(0, cuts[i]).replace(/[\s,;:]+$/, ''))
      if (tooltip.offsetHeight <= avail) return true
    }
    tooltip.innerHTML = cardHtml(nd, null)
    if (tooltip.offsetHeight <= avail) return true
    // Nothing fits. The card carries identity only: half a verdict read as whole
    // is the one outcome this card must never produce.
    tooltip.innerHTML = cardHtml(nd, null, true)
    return tooltip.offsetHeight <= avail
  }

  // ---- the opinion ----
  // "Clicking on it should just open up that case" — this is the case. The text
  // is fetched on demand from cases/<file>, which sync-viewer.mjs copies out of
  // corpus/ and newcases/. Nothing is bundled into this page: 1.9MB of opinions
  // in a const literal would be paid for on every load by everyone who never
  // opens one. If the fetch fails the box says so and names the path it tried —
  // an empty reader that looks like an empty opinion is the failure to avoid.
  const opCache = new Map()
  async function loadOpinion(file, box) {
    if (!box) return
    if (opCache.has(file)) { box.innerHTML = opCache.get(file); return }
    box.innerHTML = '<div class="opnote">Loading\u2026</div>'
    try {
      const res = await fetch('cases/' + encodeURIComponent(file))
      if (!res.ok) throw new Error('HTTP ' + res.status)
      const raw = await res.text()
      // res.ok is NOT evidence that this is an opinion. A dev server — and most
      // static hosts serving a single-page app — answer an unknown path with
      // index.html and a 200, and this box rendered that markup as the court's
      // words, which is precisely the fail-open the notice below exists to stop.
      // Every corpus file opens with a "Case:" header; nothing else is one.
      if (!/^Case:\s*\S/.test(raw)) throw new Error('the file at that path is not an opinion (no "Case:" header)')
      const html = opinionHtml(raw)
      opCache.set(file, html)
      box.innerHTML = html
    } catch (err) {
      box.innerHTML = `<div class="opnote bad">This opinion did not load from <code>cases/${esc(file)}</code> \u2014 ${esc(String((err && err.message) || err))}. The ranking above does not depend on it: it was computed when the library was built.</div>`
    }
  }
  // The 5-line provenance header is metadata, already shown in the card above,
  // so it is stripped from the reading text and its Source line kept as the
  // attribution strip — the one line that says where this document came from.
  function opinionHtml(raw) {
    const ls = raw.split(/\r?\n/)
    const head = {}
    let i = 0
    for (; i < ls.length && i < 8; i++) {
      const m = ls[i].match(/^(Case|Court|Date|Citation|Source):\s*(.*)$/)
      if (!m) break
      head[m[1]] = m[2]
    }
    const paras = ls.slice(i).join('\n').trim().split(/\n\s*\n/).filter((p) => p.trim())
    return `<div class="opsrc">${esc(head.Source || 'No source line in this file header')} \u00b7 archival text, truncated at the tail</div>`
      + (paras.length ? paras.map((p) => `<p>${esc(p.trim())}</p>`).join('')
        : '<div class="opnote bad">This file has a header but no body text.</div>')
  }

  // ---- keyboard ----
  addEventListener('keydown', (ev) => {
    if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA') {
      if (ev.key === 'Escape') ev.target.blur()
      return
    }
    if (ev.key === 'Escape') {
      if (isFull()) setFull(false)
      else if (listMode === 'subject') showLibrary()
      else if (subject !== null) setSubject(null)
      return
    }
    if (ev.key === '/') { ev.preventDefault(); searchEl.focus(); searchEl.select(); return }
    if (ev.key === 'f' || ev.key === 'm') { setFull(!isFull()); return }
    if (listMode !== 'subject' || subject === null) return
    const lis = [...content.querySelectorAll('.rows > li')]
    if (!lis.length) return
    const focused = document.activeElement?.closest?.('li')
    const idx = focused ? lis.indexOf(focused) : -1
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault()
      const next = lis[Math.max(0, Math.min(lis.length - 1, idx + (ev.key === 'ArrowDown' ? 1 : -1)))]
      next?.querySelector('.rowbtn')?.focus()
    }
    if (ev.key === 'o' && focused) setSubject(+focused.dataset.id)
  })

  // ---- boot ----
  // The lane used to boot into renderLibrary(), i.e. a 99-row directory with the
  // whole feature hidden behind a CTA. It boots into a worked subject now, with
  // the map already drawn beside it.
  function defaultSubject() {
    const rich = newIds.find((id) => missCount(nodes[id]) >= 3)
    return rich !== undefined ? rich : newIds.length ? newIds[0] : 0
  }
  function bootRoute() {
    const want = (PARAMS.get('case') || '').trim()
    if (want) {
      const hit = nodes.find((x) => x.file === want)
      if (hit) { setSubject(hit.id, { focus: false }); return }
      // fail loud: say the key missed rather than silently showing something else
      document.getElementById('notice').innerHTML =
        `<div class="notice">Requested case &ldquo;${esc(want)}&rdquo; is not in this library &mdash; showing the example below instead.</div>`
    }
    setSubject(defaultSubject(), { focus: false })
  }
  readCSSColors()
  document.getElementById('footline').textContent =
    `Ranked from the ${nodes.length} published opinions indexed when this library was built and shipped with the app. Citation sets are lower bounds — archival text is truncated. Nothing you do here leaves this machine.`
  renderChips()
  resize()
  bootRoute()
</script>
</body>
</html>
